<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림 글상자 묶기</title>
<style>

/* Layout: 한글 오피스식 — 제목줄, 메뉴 탭+리본, 서식 도구 상자, [그림 목록 | 회색 작업 영역 | 속성], 상태 표시줄 */
:root{
  --chrome:#f3f5f9; --chrome-2:#e6eaf2; --line:#cdd4e1; --line-2:#b6c0d2;
  --ink:#1d2433; --ink-2:#55607a; --ink-3:#8590a6;
  --brand:#1e5bc6; --brand-ink:#ffffff; --brand-soft:#dfe9fb;
  --desk:#7d8696; --guide:#2f80ff; --ok:#1f8a4c; --danger:#c53a3a;
  --ui:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --num:"Consolas","D2Coding",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 var(--ui);color:var(--ink);background:var(--chrome);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

.titlebar{display:flex;align-items:center;gap:8px;background:var(--brand);color:var(--brand-ink);padding:5px 12px;flex:none}
.titlebar .logo{width:20px;height:20px;border-radius:4px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.titlebar input{background:transparent;border:1px solid transparent;color:#fff;padding:2px 6px;border-radius:3px;min-width:80px;max-width:50vw;width:200px;field-sizing:content;font-weight:600}
.titlebar input:hover,.titlebar input:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.1);outline:none}
.titlebar .ext{opacity:.8}
.titlebar .sp{flex:1}
.titlebar .saved{font-size:12px;opacity:.85;white-space:nowrap}

.menutabs{display:flex;gap:2px;background:var(--chrome);padding:4px 8px 0;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.menutabs button{border:1px solid transparent;border-bottom:none;background:none;padding:5px 14px;border-radius:4px 4px 0 0;color:var(--ink-2);white-space:nowrap}
.menutabs button:hover{background:var(--chrome-2)}
.menutabs button[aria-selected="true"]{background:#fff;border-color:var(--line);color:var(--brand);font-weight:700;margin-bottom:-1px}

.ribbon{background:#fff;border-bottom:1px solid var(--line);padding:6px 8px;display:flex;gap:4px;align-items:stretch;min-height:74px;flex:none;overflow-x:auto}
.ribbon .grp{display:flex;align-items:stretch;gap:2px;padding:0 6px;border-right:1px solid var(--chrome-2)}
.ribbon .grp:last-child{border-right:none}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:58px;padding:4px 8px;border:1px solid transparent;background:none;border-radius:4px;font-size:12px;color:var(--ink);white-space:nowrap}
.rb svg{width:26px;height:26px}
.rb:hover:not(:disabled){background:var(--brand-soft);border-color:#b9cdf3}
.rb[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand)}
.rb:disabled{opacity:.4;cursor:default}
.rb.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.rb.primary:hover:not(:disabled){background:#174ba6}
.rb.big{min-width:96px}
.mini{display:flex;flex-direction:column;justify-content:center;gap:5px;font-size:12px;color:var(--ink-2);padding:0 4px}
.mini label{display:flex;align-items:center;gap:6px;white-space:nowrap}
.mini input[type=number]{width:64px;padding:2px 4px;border:1px solid var(--line-2);border-radius:3px;background:#fff;font-family:var(--num)}
.mini input:disabled{opacity:.5}

.formatbar{display:flex;align-items:center;gap:4px;padding:4px 8px;background:var(--chrome);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.formatbar .sep{width:1px;height:20px;background:var(--line-2);margin:0 4px;flex:none}
.formatbar select,.formatbar input[type=number]{height:26px;border:1px solid var(--line-2);border-radius:3px;background:#fff;padding:0 4px;flex:none}
.formatbar #fFont{width:118px}
.formatbar #fSize{width:58px}
.fb{width:28px;height:26px;border:1px solid transparent;background:none;border-radius:3px;display:grid;place-items:center;flex:none;padding:0}
.fb svg{width:16px;height:16px}
.fb:hover:not(:disabled){background:var(--brand-soft);border-color:#b9cdf3}
.fb[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand)}
.formatbar.off .fb,.formatbar.off select,.formatbar.off input{opacity:.4;pointer-events:none}
.colorbtn{position:relative}
.colorbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.colorbtn .swatch{position:absolute;left:6px;right:6px;bottom:3px;height:4px;border-radius:1px}
.fbl{font-size:12px;color:var(--ink-3);margin-left:2px;flex:none}

.main{flex:1;display:grid;grid-template-columns:150px minmax(0,1fr) 260px;min-height:0}
.list{background:var(--chrome);border-right:1px solid var(--line);overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.list h3,.panel h3{margin:0;font-size:12px;letter-spacing:.04em;color:var(--ink-2);font-weight:700}
.thumb{border:2px solid transparent;border-radius:3px;background:#fff;padding:4px;display:flex;flex-direction:column;align-items:stretch;gap:4px;color:var(--ink-2);font-size:11px;text-align:left}
.thumb .tw{position:relative;background:var(--chrome-2)}
.thumb img{display:block;width:100%;height:auto}
.thumb .tb{position:absolute;inset:0;outline:1.5px dashed var(--guide);outline-offset:-2px}
.thumb[aria-current="true"]{border-color:var(--brand)}
.thumb .meta{display:flex;justify-content:space-between;gap:4px}
.badge{font-size:10px;padding:0 5px;border-radius:8px;background:var(--chrome-2);color:var(--ink-2);white-space:nowrap}
.badge.on{background:#dcf1e4;color:var(--ok)}
.addbtn{border:1px dashed var(--line-2);background:none;border-radius:3px;padding:10px 6px;color:var(--ink-2);font-size:12px}
.addbtn:hover{border-color:var(--brand);color:var(--brand)}

.desk{background:var(--desk);overflow:auto;position:relative;outline:none}
.desk.dragover{box-shadow:inset 0 0 0 4px var(--guide)}
.deskin{min-width:100%;min-height:100%;display:flex;padding:32px;box-sizing:border-box}
.stage{position:relative;margin:auto;flex:none;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.stage > img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.stage .tbox{position:absolute;inset:0;outline:1.5px dashed var(--guide);outline-offset:-1px}
.stage.noguides .tbox{outline-color:transparent}
.stage.noguides .tbox:focus-within{outline-color:rgba(47,128,255,.5)}
.tbox textarea{position:absolute;inset:0;width:100%;height:100%;border:none;resize:none;background:transparent;outline:none;overflow:hidden;margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.tbox textarea::placeholder{color:rgba(47,128,255,.6)}
.tbox .tag{position:absolute;left:0;top:-22px;background:var(--guide);color:#fff;font-size:11px;padding:2px 7px;border-radius:3px 3px 0 0;white-space:nowrap;pointer-events:none}
.stage.noguides .tag{display:none}
.dims{position:absolute;right:0;bottom:-22px;color:#fff;font:11px var(--num);white-space:nowrap}
.emptydesk{margin:auto;max-width:420px;background:#fff;border-radius:6px;padding:28px 26px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.emptydesk b{font-size:16px}
.emptydesk p{margin:0;color:var(--ink-2);line-height:1.6}

.panel{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel section{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.fld{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink-2)}
.fld .u{position:relative}
.fld input{border:1px solid var(--line-2);border-radius:3px;padding:3px 26px 3px 6px;font:12px var(--num);background:#fff;width:100%}
.fld .u i{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--ink-3);font-size:11px}
.note{font-size:12px;color:var(--ink-2);line-height:1.6;margin:0}
.state{display:flex;align-items:center;gap:8px;font-size:12px;padding:8px 10px;border-radius:4px;background:var(--chrome)}
.state.on{background:#e7f5ec;color:var(--ok)}
.state svg{width:18px;height:18px;flex:none}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;color:var(--ink-2);margin:0}
.keys dt{font:11px var(--num);background:var(--chrome);border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--ink);justify-self:start;white-space:nowrap}
.keys dd{margin:0}
.btn{border:1px solid var(--line-2);background:#fff;border-radius:4px;padding:6px 12px;font-size:12px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:#174ba6;color:#fff}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.howto{background:var(--brand-soft);border-radius:4px;padding:10px 12px}
.howto ol{margin:4px 0 0;padding-left:18px;font-size:12px;line-height:1.65}

.status{display:flex;gap:18px;align-items:center;padding:3px 12px;background:var(--chrome-2);border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);flex:none;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.status .sp{flex:1}
.status input[type=range]{width:110px;vertical-align:middle}

.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:900px){
  body{overflow:auto}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(340px,1fr) auto}
  .list{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  .thumb,.addbtn{width:96px;flex:none}
  .panel{border-left:none;border-top:1px solid var(--line)}
}

/* 글상자 개체 */
.stage{user-select:none;-webkit-user-select:none;touch-action:none}
.stage.drawing{cursor:crosshair}
.bx{position:absolute;outline:1.5px dashed var(--guide);outline-offset:-1px;cursor:move}
.bx.ell{border-radius:50%}
.stage.noguides .bx{outline-color:transparent}
.stage.noguides .bx:hover{outline-color:rgba(47,128,255,.5)}
.bx.sel{outline:2px solid var(--guide);outline-offset:-1px}
.bx .tx{position:absolute;inset:0;display:flex;flex-direction:column;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;pointer-events:none;overflow:hidden}
.bx.ell .tx{border-radius:50%}
.bx .tx.ph{color:rgba(47,128,255,.75)!important;font-weight:400!important}
.stage.noguides .bx:not(.sel) .tx.ph{color:transparent!important}
.bx textarea{position:absolute;inset:0;width:100%;height:100%;border:none;resize:none;background:rgba(255,255,255,.35);outline:none;overflow:hidden;margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;cursor:text}
.bx.ell textarea{border-radius:50%}
.hd{position:absolute;width:10px;height:10px;background:#fff;border:1.5px solid var(--guide);z-index:5;margin:-5px 0 0 -5px}
.hd[data-h=nw],.hd[data-h=se]{cursor:nwse-resize}
.hd[data-h=ne],.hd[data-h=sw]{cursor:nesw-resize}
.hd[data-h=n],.hd[data-h=s]{cursor:ns-resize}
.hd[data-h=e],.hd[data-h=w]{cursor:ew-resize}
.ghost{position:absolute;border:1.5px dashed var(--guide);background:rgba(47,128,255,.08);pointer-events:none;z-index:6}
.ghost.ell{border-radius:50%}
.hint{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:4px 10px;border-radius:4px;white-space:nowrap;pointer-events:none}
.thumb .tw .ob{position:absolute;outline:1.5px dashed var(--guide);outline-offset:-1px}
.thumb .tw .ob.ell{border-radius:50%}
.shapepick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.shapepick button{border:1px solid var(--line-2);background:#fff;border-radius:4px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink)}
.shapepick button:hover{border-color:var(--brand);color:var(--brand)}
.shapepick button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.shapepick svg{width:26px;height:26px}
.panel textarea.content{border:1px solid var(--line-2);border-radius:3px;padding:6px;min-height:90px;resize:vertical;width:100%;font:13px/1.5 var(--ui)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 .fld input{padding-right:6px}
.bx.mos{outline-color:rgba(255,255,255,.9);outline-style:dashed}
.bx.mos.sel{outline:2px solid var(--guide)}
.bx canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.stage.noguides .bx.mos{outline-color:transparent}
.thumb .tw .ob.mos{background:rgba(120,130,150,.55);outline-color:#fff}
.shapepick.four{grid-template-columns:repeat(2,1fr)}
.shapepick.four button[data-shape="sticker"]{grid-column:1 / -1}
.shapepick.four button{flex-direction:row;justify-content:flex-start;gap:8px;padding:6px 8px;font-size:12px;white-space:nowrap}
.shapepick.four svg{width:22px;height:22px;flex:none}
.tcell{position:relative;flex:none}
.tchk{position:absolute;top:7px;left:7px;width:17px;height:17px;z-index:2;accent-color:var(--brand);cursor:pointer;margin:0}
.tcell.off .thumb{opacity:.5}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.lhead label{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);cursor:pointer}
.lhead input{accent-color:var(--brand);margin:0}
.libsep{border:none;border-top:1px solid var(--line);margin:6px 0 0;width:100%}
.libnote{font-size:11px;color:var(--ink-3);line-height:1.5;margin:0}
.tcell.lib .thumb{background:#fffdf5}
.tcell.lib .meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.tcell.lib .namein{width:100%;font-size:11px;padding:1px 3px;border:1px solid var(--brand);border-radius:2px}
.tdel.ask{width:auto;padding:0 8px;border-radius:11px;background:var(--danger);font-size:11px;opacity:1}
.tcell .thumb{width:100%}
.tdel{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1.5px solid #fff;background:var(--ink-2);color:#fff;display:grid;place-items:center;padding:0;opacity:0;transition:opacity .12s;box-shadow:0 1px 3px rgba(0,0,0,.3);z-index:2}
.tdel svg{width:10px;height:10px}
.tcell:hover .tdel,.tcell:focus-within .tdel,.tcell.cur .tdel{opacity:1}
.tdel:hover{background:var(--danger)}
@media (hover:none){.tdel{opacity:1}}
@media (max-width:900px){.tcell{width:96px}}
.deco{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:12px;color:var(--ink-2)}
.deco .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden}
.seg button{border:none;background:#fff;padding:4px 9px;font-size:12px;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);font-weight:700}
.sw{width:30px;height:24px;border:1px solid var(--line-2);border-radius:4px;padding:0;background:none;cursor:pointer}
.deco select{border:1px solid var(--line-2);border-radius:3px;padding:2px 4px;background:#fff}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.2);padding:0;cursor:pointer}
.panel input[type=range]{width:100%}
.ctxmenu{position:fixed;z-index:60;min-width:190px;background:#fff;border:1px solid var(--line-2);border-radius:6px;box-shadow:0 6px 20px rgba(20,30,50,.22);padding:4px;display:flex;flex-direction:column}
.ctxmenu button{display:flex;justify-content:space-between;align-items:center;gap:16px;border:none;background:none;padding:7px 10px;border-radius:4px;font-size:13px;text-align:left;color:var(--ink)}
.ctxmenu button:hover,.ctxmenu button:focus{background:var(--brand-soft);outline:none}
.ctxmenu button.danger{color:var(--danger)}
.ctxmenu kbd{font:11px var(--num);color:var(--ink-3)}
.ctxmenu hr{border:none;border-top:1px solid var(--line);margin:3px 4px}
.bprev{background:repeating-conic-gradient(#eef1f6 0 25%,#fff 0 50%) 0 0/12px 12px;padding:8px;display:flex;align-items:center;justify-content:center;min-height:56px}
.bp{width:100%;max-height:90px;display:flex;flex-direction:column;overflow:hidden;font-size:10px;line-height:1.35;padding:3px 5px;word-break:keep-all}
.bp.ell{border-radius:50%;width:64px;height:64px;flex:none;padding:4px;text-align:center!important;justify-content:center!important}
.bp span{display:block}
.bx.pic{outline-color:rgba(47,128,255,.55)}
.stage.noguides .bx.pic{outline-color:transparent}
.bx.pic img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.thumb .tw img.ob.pic{position:absolute;outline:none;object-fit:fill}
.bprev .pprev{max-width:100%;max-height:72px;display:block}
.libadd{border:1px solid var(--line-2);background:#fff;border-radius:3px;font-size:11px;padding:2px 6px;color:var(--ink-2)}
.libadd:hover{border-color:var(--brand);color:var(--brand)}
.a4page{position:relative;margin:auto;flex:none;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.a4margin{position:absolute;border:1px dashed #c9d2e3;pointer-events:none}
.a4lab{position:absolute;right:0;bottom:-22px;color:#fff;font-size:11px;white-space:nowrap}
.stage.onpage{box-shadow:none}
.stage.onpage .dims{bottom:auto;top:-18px;color:var(--ink-3)}
.viewseg button{padding:1px 8px;font-size:11px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,28,45,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3);width:min(760px,100%);height:min(620px,100%);display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:baseline;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:14px}
.mhint{font-size:12px;color:var(--ink-3)}
.mtools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:var(--chrome);border-bottom:1px solid var(--line)}
.mrange{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.mrange input{width:140px}
.mrange b{font:12px var(--num);min-width:2ch;color:var(--ink)}
.mcanvas{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#e3e7ef 0 25%,#fff 0 50%) 0 0/16px 16px;overflow:hidden}
.mcanvas canvas{cursor:crosshair;image-rendering:auto;box-shadow:0 0 0 1px rgba(47,128,255,.35)}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.mchk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}
.mchk input{accent-color:var(--brand);margin:0}
.lockrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);cursor:pointer}
.lockrow input{accent-color:var(--brand);margin:0}
/* ===== 한글 오피스 모양 화면 구성 ===== */
:root{ --ctx:#d9731a; --ctx-soft:#fdeedd; --tab-h:30px; }
body{background:var(--chrome)}

/* 제목 표시줄 + 빠른 실행 도구 */
.titlebar{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:4px 10px;background:var(--brand);color:#fff;flex:none}
.qat{display:flex;gap:2px;padding-right:8px;border-right:1px solid rgba(255,255,255,.25)}
.qb{width:26px;height:24px;border:none;background:none;color:#fff;border-radius:3px;display:grid;place-items:center;padding:0}
.qb svg{width:16px;height:16px}
.qb:hover:not(:disabled){background:rgba(255,255,255,.18)}
.qb:disabled{opacity:.4;cursor:default}
.tname{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;overflow:hidden}
.tname .app{opacity:.8}
.titlebar input{width:auto}
.helpbtn{display:flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:4px;padding:2px 9px;font-size:12px}
.helpbtn svg{width:15px;height:15px}
.helpbtn:hover{background:rgba(255,255,255,.22)}

/* 메뉴 탭 (이름 누르면 리본, ▾ 누르면 메뉴 목록) */
.menutabs{display:flex;align-items:flex-end;gap:2px;padding:4px 8px 0;background:var(--chrome);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.mtab{display:flex;align-items:stretch;border:1px solid transparent;border-bottom:none;border-radius:4px 4px 0 0;color:var(--ink-2);white-space:nowrap;height:var(--tab-h)}
.mtab button{border:none;background:none;color:inherit;padding:0 4px 0 12px;font:inherit}
.mtab .caret{padding:0 8px 0 2px;font-size:10px;opacity:.7}
.mtab:hover{background:var(--chrome-2)}
.mtab .caret:hover{opacity:1;color:var(--brand)}
.mtab.on{background:#fff;border-color:var(--line);color:var(--brand);font-weight:700;margin-bottom:-1px;height:calc(var(--tab-h) + 1px)}
.mtab.ctx{color:var(--ctx);font-weight:700;position:relative}
.mtab.ctx::before{content:"";position:absolute;left:6px;right:6px;top:0;height:3px;background:var(--ctx);border-radius:0 0 2px 2px}
.mtab.ctx.on{color:var(--ctx);background:#fff}
.ctxlabel{align-self:center;font-size:11px;color:var(--ctx);margin:0 2px 0 10px;padding-bottom:4px;white-space:nowrap}

/* 리본: 큰 단추 + 묶음 이름 */
.ribbon{background:#fff;border-bottom:1px solid var(--line);padding:4px 6px 0;display:flex;align-items:stretch;gap:0;min-height:88px;flex:none;overflow-x:auto}
.ribbon.ctx{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(var(--ctx),var(--ctx)) border-box;border-top:2px solid var(--ctx)}
.grp{display:flex;flex-direction:column;padding:0 8px;border-right:1px solid var(--chrome-2);flex:none}
.grp:last-child{border-right:none}
.gbody{display:flex;align-items:stretch;gap:2px;flex:1}
.gcap{font-size:11px;color:var(--ink-3);text-align:center;padding:2px 0 3px;white-space:nowrap}
.rb{min-width:56px}
.rb .k{display:none}
.mini{justify-content:center}
.mini .row{display:flex;align-items:center;gap:6px;white-space:nowrap}
.mini select{border:1px solid var(--line-2);border-radius:3px;padding:2px 4px;background:#fff}
.mini input[type=color]{width:28px;height:22px;padding:0;border:1px solid var(--line-2);border-radius:3px;background:none}
.mini input[type=range]{width:120px}
.mini .seg button{padding:2px 8px}
.ribbon .note{font-size:11px;color:var(--ink-3);max-width:180px;white-space:normal;line-height:1.4;align-self:center;margin:0 4px}

/* 서식 도구 상자 */
.formatbar .strong{color:var(--ink-2);font-weight:700;margin-right:4px}
.fbhint{font-size:12px;color:var(--ink-3);margin-left:8px;white-space:nowrap}
.formatbar:not(.off) .fbhint{display:none}

/* 본문: 작업 목록 | 눈금자 + 편집 화면 | 작업 창 */
.main{grid-template-columns:168px minmax(0,1fr) 272px}
.main.nol{grid-template-columns:0 minmax(0,1fr) 272px}
.main.nor{grid-template-columns:168px minmax(0,1fr) 0}
.main.nol.nor{grid-template-columns:0 minmax(0,1fr) 0}
.main.nol .pane.left,.main.nor .pane.right{display:none}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--chrome)}
.pane.left{border-right:1px solid var(--line)}
.pane.right{border-left:1px solid var(--line);background:#fff}
.panehead{display:flex;align-items:center;justify-content:space-between;height:28px;padding:0 6px 0 12px;background:var(--chrome-2);border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-2);flex:none}
.paneclose{border:none;background:none;width:22px;height:22px;border-radius:3px;color:var(--ink-3);font-size:15px;line-height:1;padding:0}
.paneclose:hover{background:var(--line);color:var(--ink)}
.pane .list{flex:1;border:none}
.pane .panel{flex:1;border:none}

.deskwrap{display:grid;grid-template-columns:20px minmax(0,1fr);grid-template-rows:20px minmax(0,1fr);min-height:0;min-width:0;background:var(--desk)}
.deskwrap.norulers{grid-template-columns:0 minmax(0,1fr);grid-template-rows:0 minmax(0,1fr)}
.deskwrap.norulers .ruler,.deskwrap.norulers .rcorner{display:none}
.rcorner{background:var(--chrome-2);border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.ruler{display:block;width:100%;height:100%;background:var(--chrome-2)}
.ruler.h{border-bottom:1px solid var(--line-2)}
.ruler.v{border-right:1px solid var(--line-2)}
.deskwrap .desk{grid-column:2;grid-row:2}

/* 상태 표시줄 */
.status{gap:10px;padding:2px 10px}
.ssep{width:1px;height:12px;background:var(--line-2)}
.shint{color:var(--brand);overflow:hidden;text-overflow:ellipsis;min-width:0}
.ssize{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;min-width:0}
.zb{width:20px;height:20px;border:none;background:none;border-radius:3px;font-size:14px;line-height:1;padding:0;color:var(--ink-2)}
.zb:hover{background:var(--line)}
.szoom{min-width:40px;text-align:right}
.status input[type=range]{width:100px}

/* 풍선 도움말 */
.tip{position:fixed;z-index:90;max-width:260px;background:#fff;color:var(--ink);border:1px solid var(--line-2);border-radius:4px;box-shadow:0 4px 14px rgba(20,30,50,.18);padding:7px 10px;font-size:12px;line-height:1.5;pointer-events:none}
.tip b{display:block;font-size:12.5px}
.tip kbd{font:11px var(--num);color:var(--ink-2);background:var(--chrome);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:4px}
.tip span{color:var(--ink-2)}

/* 따라하기 */
.guide{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.guide li{display:grid;grid-template-columns:24px 1fr;gap:4px 8px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.guide li.done{background:#f3faf5;border-color:#cfe9d7}
.guide li.now{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.guide .num{width:22px;height:22px;border-radius:50%;background:var(--chrome-2);color:var(--ink-2);display:grid;place-items:center;font-size:12px;font-weight:700}
.guide li.now .num{background:var(--brand);color:#fff}
.guide li.done .num{background:var(--ok);color:#fff}
.guide .gt{font-weight:700;font-size:13px}
.guide .gd{grid-column:2;font-size:12px;color:var(--ink-2);line-height:1.5}
.guide .ga{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.guide .ga .btn{padding:4px 10px}
.pastebox{background:var(--brand-soft);border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.7}
.pastebox b{color:var(--brand)}
.pastebox ol{margin:4px 0 0;padding-left:18px}

/* 도움말 창 */
.helpbox{width:min(640px,100%);height:auto;max-height:100%}
.helpbody{padding:14px 18px;overflow:auto;display:grid;gap:14px;font-size:13px;line-height:1.6}
.helpbody h4{margin:0 0 4px;font-size:13px}
.helpbody .keys{grid-template-columns:auto 1fr}

@media (max-width:900px){
  .main,.main.nol,.main.nor{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(360px,1fr) auto}
  .pane.left .list{flex-direction:row}
  .tname .app,.saved{display:none}
}

.ctxmenu .mi{display:flex;align-items:center;gap:8px}
.ctxmenu .mi svg{width:18px;height:18px;color:var(--ink-2)}
.ctxmenu button:disabled{opacity:.4;cursor:default;background:none}
[hidden]{display:none!important}
.fbhint{display:none}
.petabs button{padding:4px 14px;font-size:13px}
.mlab{font-size:12px;color:var(--ink-2)}
.mtools .seg button{padding:4px 9px}
.pestage{position:relative;touch-action:none;user-select:none;flex:none}
.pestage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.cropbox{position:absolute;box-shadow:0 0 0 9999px rgba(15,22,38,.55);outline:1.5px solid #fff;cursor:move}
.cropbox::before,.cropbox::after{content:"";position:absolute;inset:0;pointer-events:none;border:0 solid rgba(255,255,255,.45)}
.cropbox::before{left:33.33%;right:33.33%;border-left-width:1px;border-right-width:1px}
.cropbox::after{top:33.33%;bottom:33.33%;border-top-width:1px;border-bottom-width:1px}
.cropbox i{position:absolute;width:12px;height:12px;background:#fff;border:1.5px solid var(--brand);margin:-6px 0 0 -6px;z-index:2}
.cropbox i[data-c=nw]{left:0;top:0;cursor:nwse-resize}.cropbox i[data-c=n]{left:50%;top:0;cursor:ns-resize}.cropbox i[data-c=ne]{left:100%;top:0;cursor:nesw-resize}
.cropbox i[data-c=e]{left:100%;top:50%;cursor:ew-resize}.cropbox i[data-c=se]{left:100%;top:100%;cursor:nwse-resize}.cropbox i[data-c=s]{left:50%;top:100%;cursor:ns-resize}
.cropbox i[data-c=sw]{left:0;top:100%;cursor:nesw-resize}.cropbox i[data-c=w]{left:0;top:50%;cursor:ew-resize}
.pestage.erasing .cropbox{pointer-events:none;box-shadow:0 0 0 9999px rgba(15,22,38,.3);outline:1px dashed #fff}
.pestage.erasing .cropbox i,.pestage.erasing .cropbox::before,.pestage.erasing .cropbox::after{display:none}
.mcanvas{overflow:hidden}
.stage.basesel{outline:2px solid var(--guide);outline-offset:1px;cursor:move}
.bh{position:absolute;width:12px;height:12px;background:#fff;border:1.5px solid var(--guide);z-index:8;margin:-6px 0 0 -6px}
.bh[data-bh=nw]{left:0;top:0;cursor:nwse-resize}.bh[data-bh=n]{left:50%;top:0;cursor:ns-resize}.bh[data-bh=ne]{left:100%;top:0;cursor:nesw-resize}
.bh[data-bh=e]{left:100%;top:50%;cursor:ew-resize}.bh[data-bh=se]{left:100%;top:100%;cursor:nwse-resize}.bh[data-bh=s]{left:50%;top:100%;cursor:ns-resize}
.bh[data-bh=sw]{left:0;top:100%;cursor:nesw-resize}.bh[data-bh=w]{left:0;top:50%;cursor:ew-resize}
.bghost{position:absolute;border:1.5px dashed var(--guide);background:rgba(47,128,255,.08);pointer-events:none;z-index:9}
.bghost::after{content:attr(data-size);position:absolute;right:0;bottom:-20px;background:var(--guide);color:#fff;font:11px var(--num);padding:1px 5px;border-radius:2px;white-space:nowrap}
.objsec{order:-1;border-bottom:1px solid var(--line);padding-bottom:12px}
.objlist{max-height:176px;overflow-y:auto}
.objsec h3{display:flex;align-items:center;gap:6px}
.objlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.objlist li{display:flex;align-items:center;border-bottom:1px solid var(--line);background:#fff}
.objlist li:last-child{border-bottom:none}
.objlist li.on{background:var(--brand-soft)}
.objlist .oname{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:none;background:none;padding:6px 8px;text-align:left;font-size:12px;color:var(--ink)}
.objlist .oname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.objlist .oname svg{width:16px;height:16px;flex:none;color:var(--ink-2)}
.objlist li.on .oname{color:var(--brand);font-weight:700}
.objlist li.locked .oname{color:var(--ink-3)}
.objlist .olock{border:none;background:none;width:30px;align-self:stretch;display:grid;place-items:center;color:var(--ink-3);padding:0}
.objlist .olock svg{width:14px;height:14px}
.objlist .olock[aria-pressed="true"]{color:var(--ctx)}
.objlist .olock:hover{background:var(--chrome)}
.bx[data-locked]{cursor:default}
.bx[data-locked].sel{outline:2px dashed var(--ctx)}
.ctxmenu .mcap{font-size:11px;color:var(--ink-3);padding:4px 10px 2px}
.ctxmenu .mi i{display:inline-block;width:1ch}
.ctxmenu [aria-checked="true"]{color:var(--brand);font-weight:700}
.picksec{order:9;border-top:1px solid var(--line);padding-top:12px}
.mtab .caret:focus-visible{outline-offset:-2px}
@media (max-width:900px){.pane.left .lhead,.pane.left .libnote,.pane.left .libsep{display:none}.pane.left .list{flex-direction:row;overflow-x:auto;align-items:flex-start}}
.formatbar.nosel .fbhint{display:inline}
</style>
</head>
<body>

<header class="titlebar">
  <div class="logo" aria-hidden="true">한</div>
  <div class="qat" aria-label="빠른 실행 도구">
    <button type="button" class="qb" data-act="export" data-tip-title="한글 파일로 저장" data-tip="체크한 그림을 한글 문서(.hwpx)로 저장합니다." data-key="Ctrl+S" aria-label="한글 파일로 저장"><svg viewBox="0 0 16 16"><path d="M2.5 2.5h9l2 2v9h-11z" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="5" y="2.5" width="5" height="3.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="4.5" y="9" width="7" height="4.5" fill="currentColor" opacity=".35"/></svg></button>
    <button type="button" class="qb" data-act="undo" data-tip-title="되돌리기" data-tip="방금 한 일을 취소합니다." data-key="Ctrl+Z" aria-label="되돌리기"><svg viewBox="0 0 16 16"><path d="M5.5 4L2.5 7l3 3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 7h7a4 4 0 0 1 0 8H8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button type="button" class="qb" data-act="redo" data-tip-title="다시 실행" data-tip="되돌린 일을 다시 합니다." data-key="Ctrl+Y" aria-label="다시 실행"><svg viewBox="0 0 16 16"><path d="M10.5 4l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M13.5 7h-7a4 4 0 0 0 0 8H8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
  </div>
  <div class="tname"><input id="docTitle" value="그림글상자" aria-label="문서 이름" spellcheck="false"><span class="ext">.hwpx</span><span class="app">&nbsp;-&nbsp;그림 글상자 묶기</span></div>
  <span class="saved" id="savedState">자동 저장됨</span>
  <button type="button" class="helpbtn" id="helpBtn" data-tip-title="도움말" data-tip="처음 쓰는 방법과 단축키를 봅니다." data-key="F1"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 6.3a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6 1V10" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="12" r=".9" fill="currentColor"/></svg><span>도움말</span></button>
</header>

<nav class="menutabs" id="menutabs" role="tablist" aria-label="메뉴"></nav>
<div class="ribbon" id="ribbon" role="toolbar"></div>

<div class="formatbar" id="formatbar" role="toolbar" aria-label="서식 도구 상자">
  <span class="fbl strong">서식</span>
  <select id="fFont" aria-label="글꼴" data-tip-title="글꼴" data-tip="선택한 글상자의 글꼴을 바꿉니다."></select>
  <input id="fSize" type="number" min="4" max="200" step="0.5" aria-label="글자 크기" data-tip-title="글자 크기" data-tip="pt 단위입니다. 10pt가 한글 기본 크기입니다."><span class="fbl">pt</span>
  <span class="sep"></span>
  <button class="fb" id="fBold" data-tip-title="진하게" data-tip="글자를 굵게 합니다." data-key="Ctrl+B" aria-pressed="false" aria-label="진하게"><svg viewBox="0 0 16 16"><path d="M4 2h5a3 3 0 0 1 1.9 5.3A3.2 3.2 0 0 1 9.5 14H4zm2 2v3h3a1.5 1.5 0 0 0 0-3zm0 5v3h3.4a1.5 1.5 0 0 0 0-3z" fill="currentColor"/></svg></button>
  <label class="fb colorbtn" data-tip-title="글자 색" data-tip="글자 색을 고릅니다."><svg viewBox="0 0 16 16"><path d="M7 1.5h2l4 10h-2l-1-2.6H6L5 11.5H3zm-.4 5.6h2.8L8 3.6z" fill="currentColor"/></svg><span class="swatch" id="fColorSw"></span><input type="color" id="fColor" aria-label="글자 색"></label>
  <span class="sep"></span>
  <button class="fb" data-align="LEFT" data-tip-title="왼쪽 정렬" aria-label="왼쪽 정렬"><svg viewBox="0 0 16 16"><path d="M2 3h12M2 6.3h8M2 9.6h12M2 13h8" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button class="fb" data-align="CENTER" data-tip-title="가운데 정렬" aria-label="가운데 정렬"><svg viewBox="0 0 16 16"><path d="M2 3h12M4 6.3h8M2 9.6h12M4 13h8" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button class="fb" data-align="RIGHT" data-tip-title="오른쪽 정렬" aria-label="오른쪽 정렬"><svg viewBox="0 0 16 16"><path d="M2 3h12M6 6.3h8M2 9.6h12M6 13h8" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button class="fb" data-align="JUSTIFY" data-tip-title="양쪽 정렬" aria-label="양쪽 정렬"><svg viewBox="0 0 16 16"><path d="M2 3h12M2 6.3h12M2 9.6h12M2 13h8" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <span class="sep"></span>
  <button class="fb" data-valign="TOP" data-tip-title="세로 위" data-tip="글자를 글상자 위쪽에 붙입니다." aria-label="세로 위"><svg viewBox="0 0 16 16"><path d="M2 2h12" stroke="currentColor" stroke-width="1.6"/><path d="M8 13V5M5 8l3-3 3 3" stroke="currentColor" stroke-width="1.4" fill="none"/></svg></button>
  <button class="fb" data-valign="CENTER" data-tip-title="세로 가운데" data-tip="글자를 글상자 가운데에 놓습니다." aria-label="세로 가운데"><svg viewBox="0 0 16 16"><path d="M2 8h12" stroke="currentColor" stroke-width="1.6"/><path d="M8 1v4M6 3.5L8 5.5l2-2M8 15v-4M6 12.5l2-2 2 2" stroke="currentColor" stroke-width="1.3" fill="none"/></svg></button>
  <button class="fb" data-valign="BOTTOM" data-tip-title="세로 아래" data-tip="글자를 글상자 아래쪽에 붙입니다." aria-label="세로 아래"><svg viewBox="0 0 16 16"><path d="M2 14h12" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v8M5 8l3 3 3-3" stroke="currentColor" stroke-width="1.4" fill="none"/></svg></button>
  <span class="sep"></span>
  <span class="fbl">줄 간격</span>
  <select id="fLine" aria-label="줄 간격" data-tip-title="줄 간격" data-tip="160%가 한글 기본값입니다.">
    <option value="100">100%</option><option value="130">130%</option><option value="160">160%</option><option value="180">180%</option><option value="200">200%</option><option value="250">250%</option>
  </select>
  <span class="fbhint" id="fbHint">글상자를 선택하면 그 글상자에 적용됩니다. 선택하지 않으면 새로 만들 글상자의 서식이 됩니다.</span>
</div>

<div class="main" id="main">
  <aside class="pane left" aria-label="작업 목록">
    <div class="panehead"><span>작업 목록</span><button type="button" class="paneclose" data-act="paneList" aria-label="작업 목록 창 닫기" data-tip-title="작업 목록 창 닫기" data-tip="보기 탭에서 다시 열 수 있습니다.">×</button></div>
    <div class="list" id="list"></div>
  </aside>
  <section class="deskwrap" id="deskwrap">
    <div class="rcorner" aria-hidden="true"></div>
    <canvas class="ruler h" id="rulerH" aria-hidden="true"></canvas>
    <canvas class="ruler v" id="rulerV" aria-hidden="true"></canvas>
    <div class="desk" id="desk" tabindex="-1"><div class="deskin" id="deskin"></div></div>

/* 되돌리기 */
const snap = () => JSON.stringify({ doc, cur });
function pushUndo() { undoStack.push(snap()); if (undoStack.length > 60) undoStack.shift(); redoStack = []; }

function redo() { if (!redoStack.length) return; undoStack.push(snap()); load(redoStack.pop()); }

/* 저장소: 작업 상태와 보관함은 브라우저의 IndexedDB에 (용량이 커서 그림도 넉넉히 들어감) */
let dbp = null, library = [];
function idb() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open('hwp-pic-textbox', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('lib', { keyPath:'id' }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function idbDo(store, mode, fn) {
  const d = await idb();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode), req = fn(t.objectStore(store));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
let pt;
function persist() {
  $('#savedState').textContent = '저장 중…';
  clearTimeout(pt);
  pt = setTimeout(async () => {
    try { await idbDo('kv', 'readwrite', st => st.put({ doc, lastStyle }, 'state')); $('#savedState').textContent = '자동 저장됨'; }
    catch (e) {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ doc, lastStyle })); $('#savedState').textContent = '자동 저장됨'; }
      catch (e2) { $('#savedState').textContent = '자동 저장하지 못함 · 작업 저장을 쓰세요'; }
    }
  }, 500);
}
function migrate(d) {
  d.items.forEach(it => {
    if (!it.boxes) it.boxes = it.box ? [{ ...STYLE_DEFAULT, ...PAD.rect, ...it.box, id:uid(), shape:'rect', fx:0, fy:0, fw:1, fh:1 }] : [];
    delete it.box;
    it.boxes.forEach(b => { if (isText(b)) for (const k in DECO_DEFAULT) if (b[k] === undefined) b[k] = DECO_DEFAULT[k]; });
    it.checked = it.checked !== false;
  });
  if (d.shrink === undefined) d.shrink = true;
  if (!d.view) d.view = 'img';
  return d;
}
async function restore() {
  let st = null;
  try { st = await idbDo('kv', 'readonly', x => x.get('state')); } catch (e) {}
  if (!st) try { st = JSON.parse(localStorage.getItem(LS_KEY) || 'null') || JSON.parse(localStorage.getItem('hwp-pic-textbox-v1') || 'null'); } catch (e) {}
  try { library = (await idbDo('lib', 'readonly', x => x.getAll())) || []; library.sort((a, b) => b.created - a.created); } catch (e) { library = []; }
  if (!st || !st.doc || !Array.isArray(st.doc.items) || !st.doc.items.length) return false;
  doc = migrate(st.doc); if (st.lastStyle) lastStyle = { ...STYLE_DEFAULT, ...st.lastStyle };
  return true;
}
/* 예시 그림: 말풍선(사각 글상자) + 해님(원형 글상자) */

/* ===== 그리기 ===== */
function renderAll() {
  $('#docTitle').value = doc.title || '그림글상자';
  renderRibbon(); renderList(); renderStage(); renderFormat(); renderPanel(); renderStatus();
}
function scale() { return zoom * PX_PER_MM; }
function fitZoom() {
  const it = item(); if (!it) return 1;
  const d = $('#desk'); const aw = d.clientWidth - 80, ah = d.clientHeight - 110;
  if (aw <= 0 || ah <= 0) return zoom;
  if (doc.view === 'a4') {
    const pw = Math.max(A4.w, A4.left + it.w + 10), ph = Math.max(A4.h, A4.top + it.h + 10);
    return clamp(Math.min(aw / (pw * PX_PER_MM), (ah + 40) / (ph * PX_PER_MM)), 0.2, 3);
  }
  return clamp(Math.min(aw / (it.w * PX_PER_MM), ah / (it.h * PX_PER_MM), 2.5), 0.2, 3);
}
function textCss(b, s) {
  const f = FONT[b.font] || FONTS[0];
  return { fontFamily:f.css, fontSize:(b.size * 25.4 / 72 * s) + 'px', lineHeight:String(b.line / 100), fontWeight:b.bold ? '700' : '400', color:b.color,
    textAlign:b.align === 'JUSTIFY' ? 'justify' : b.align.toLowerCase(),
    justifyContent:b.valign === 'CENTER' ? 'center' : b.valign === 'BOTTOM' ? 'flex-end' : 'flex-start',
    padding:`${b.padT * s}px ${b.padR * s}px ${b.padB * s}px ${b.padL * s}px` };
}

let stageEl = null;
function renderStage() {

  host.innerHTML = ''; stageEl = null;
  const it = item();
  if (!it) {
    host.innerHTML = `<div class="emptydesk"><b>그림을 넣으세요</b>
      <p>그림 파일을 여기로 끌어 놓거나 Ctrl+V로 붙여 넣으세요. 여러 장을 한 번에 넣을 수 있습니다.</p>
      <button class="btn primary" type="button" id="emptyOpen">그림 넣기…</button></div>`;
    $('#emptyOpen').onclick = () => $('#fileImg').click();
    return;
  }
  if (autoFit) zoom = fitZoom();
  const s = scale();
  const st = document.createElement('div');
  stageEl = st;
  st.className = 'stage' + (showGuides ? '' : ' noguides') + (tool ? ' drawing' : '');
  st.style.width = it.w * s + 'px'; st.style.height = it.h * s + 'px';
  const im = document.createElement('img'); im.src = it.img.dataUrl; im.alt = ''; im.draggable = false;
  st.appendChild(im);
  // 쌓이는 순서: 모자이크(그림에 입혀짐) → 얹은 그림 → 글상자
  [...it.boxes.filter(b => b.shape === 'mos'), ...stickers(it), ...textBoxes(it)].forEach(b => st.appendChild(boxEl(it, b, s)));
  if (tool) {
    const h = document.createElement('span'); h.className = 'hint';
    h.textContent = `그림 위를 끌어서 ${SHAPE_NAME[tool]}를 그리세요 · Esc 취소`;
    st.appendChild(h);
  }
  const dm = document.createElement('span'); dm.className = 'dims';
  dm.textContent = `${it.w.toFixed(1)} × ${it.h.toFixed(1)} mm`;
  st.appendChild(dm);
  if (doc.view === 'a4') {
    // A4 쪽 보기: 한글 기본 여백 자리에 그림을 놓아 실제 문서에서의 크기를 보여 줌
    const pg = document.createElement('div'); pg.className = 'a4page';
    const off = offOf(it);
    Object.assign(pg.style, { width:A4.w * s + 'px', height:Math.max(A4.h, A4.top + off.y + it.h + 15) * s + 'px' });
    const mg = document.createElement('div'); mg.className = 'a4margin';
    Object.assign(mg.style, { left:A4.left * s + 'px', top:A4.top * s + 'px', width:(A4.w - A4.left * 2) * s + 'px', height:(A4.h - A4.top - 30) * s + 'px' });
    pg.appendChild(mg);
    Object.assign(st.style, { position:'absolute', left:(A4.left + off.x) * s + 'px', top:(A4.top + off.y) * s + 'px', margin:'0' });
    st.classList.add('onpage');
    if (baseSel) {
      st.classList.add('basesel');
      ['nw','n','ne','e','se','s','sw','w'].forEach(k => { const h = document.createElement('div'); h.className = 'bh'; h.dataset.bh = k; st.appendChild(h); });
    }
    pg.appendChild(st);
    const lab = document.createElement('span'); lab.className = 'a4lab';
    lab.textContent = off.x < -0.05 || off.x + it.w > A4.w - A4.left * 2 + 0.05 ? 'A4 · 그림이 본문 영역(점선) 밖으로 나갑니다' : 'A4 · 기본 여백';
    pg.appendChild(lab);

}
function boxEl(it, b, s) {
  const m = mmBox(it, b);
  const el = document.createElement('div');
  el.className = 'bx' + (b.shape === 'ell' ? ' ell' : '') + (b.id === selId ? ' sel' : '');
  el.dataset.id = b.id;
  if (b.locked) el.dataset.locked = '1';
  Object.assign(el.style, { left:m.x * s + 'px', top:m.y * s + 'px', width:m.w * s + 'px', height:m.h * s + 'px' });
  if (b.shape === 'pic') {
    el.className = 'bx pic' + (b.id === selId ? ' sel' : '');
    const im = document.createElement('img'); im.src = b.img.dataUrl; im.alt = ''; im.draggable = false;
    el.appendChild(im);
    return el;
  }
  if (b.shape === 'mos') {
    el.className = 'bx mos' + (b.id === selId ? ' sel' : '');
    const cv = document.createElement('canvas');
    el.appendChild(cv);
    requestAnimationFrame(() => drawMosaic(cv, it, b));
    return el;
  }
  applyDeco(el, b, s);
  if (b.id === editId) {
    const ta = document.createElement('textarea');
    ta.spellcheck = false; ta.value = b.text;
    Object.assign(ta.style, textCss(b, s));
    ta.addEventListener('pointerdown', e => e.stopPropagation());
    ta.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); ta.blur(); } e.stopPropagation(); });
    ta.addEventListener('input', () => { b.text = ta.value; fitVertical(ta, b, s); const pc = $('#pText'); if (pc) pc.value = b.text; persist(); });
    ta.addEventListener('blur', () => { if (editId === b.id) { editId = null; renderStage(); renderList(); renderStatus(); if (!selBox() || true) renderPanel(); } });
    el.appendChild(ta);
    requestAnimationFrame(() => { fitVertical(ta, b, s); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); });
  } else {
    const tx = document.createElement('div');
    tx.className = 'tx' + (b.text ? '' : ' ph');
    Object.assign(tx.style, textCss(b, s));
    (b.text || '두 번 눌러 입력').split('\n').forEach(l => { const d = document.createElement('div'); d.textContent = l || '​'; tx.appendChild(d); });
    el.appendChild(tx);
  }

function applyDeco(el, b, s) {

}

/* 모자이크: 그림의 해당 영역을 칸 크기(원본 픽셀)로 거칠게 */
const imgCache = {};
function imgOf(it) {
  let im = imgCache[it.id];
  if (!im) { im = new Image(); im.src = it.img.dataUrl; imgCache[it.id] = im; im.onload = () => { if (item() === it) renderStage(); }; }
  return im.complete && im.naturalWidth ? im : null;
}
function pixelate(ctx, im, sx, sy, sw, sh, dx, dy, dw, dh, cell) {
  const tw = Math.max(1, Math.round(sw / cell)), th = Math.max(1, Math.round(sh / cell));
  const t = document.createElement('canvas'); t.width = tw; t.height = th;
  const tc = t.getContext('2d'); tc.imageSmoothingEnabled = true; tc.drawImage(im, sx, sy, sw, sh, 0, 0, tw, th);
  ctx.imageSmoothingEnabled = false; ctx.drawImage(t, 0, 0, tw, th, dx, dy, dw, dh);
}
function mosaicCell(it, b) { return Math.max(2, Math.round(Math.max(it.img.pw, it.img.ph) * (b.level || 4) / 160)); }
function drawMosaic(cv, it, b) {
  const im = imgOf(it); if (!im) return;

  cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));

function fitVertical(ta, b, s) {

  const cs = getComputedStyle(ta), m = document.createElement('div');
  Object.assign(m.style, { position:'absolute', visibility:'hidden', left:'-9999px', top:'0', boxSizing:'border-box',
    width:ta.clientWidth + 'px', padding:`0 ${cs.paddingRight} 0 ${cs.paddingLeft}`, font:cs.font, lineHeight:cs.lineHeight,
    whiteSpace:'pre-wrap', wordBreak:'keep-all', overflowWrap:'anywhere' });
  m.textContent = (ta.value || ' ') + '​';
  document.body.appendChild(m);
  const need = m.offsetHeight; m.remove();
  const free = Math.max(0, ta.clientHeight - b.padT * s - b.padB * s - need);

function drawHandles() {
  if (!stageEl) return;

  stageEl.querySelectorAll('.hd').forEach(h => h.remove());
  stageEl.querySelectorAll('.bx').forEach(e => e.classList.toggle('sel', e.dataset.id === selId));
  const b = selBox(); if (!b || editId || b.locked) return;
  const m = mmBox(item(), b), s = scale();
  const pts = { nw:[0,0], n:[.5,0], ne:[1,0], e:[1,.5], se:[1,1], s:[.5,1], sw:[0,1], w:[0,.5] };
  for (const [k, [fx, fy]] of Object.entries(pts)) {
    const h = document.createElement('div'); h.className = 'hd'; h.dataset.h = k;
    h.style.left = (m.x + m.w * fx) * s + 'px'; h.style.top = (m.y + m.h * fy) * s + 'px';
    stageEl.appendChild(h);
  }
}
function selectBase(on = true) {
  baseSel = on && doc.view === 'a4' && !!item();
  if (baseSel) { selId = null; editId = null; if (TABS.find(t => t.id === curTab)?.ctx || curTab !== 'pic') { curTab = 'pic'; prevTab = 'pic'; } }
  renderStage(); renderFormat(); renderPanel(); renderRibbon(); renderStatus();
}
function select(id) {
  selId = id; if (id) baseSel = false;
  drawHandles(); renderFormat(); renderPanel(); renderRibbon(); renderStatus();
}

/* ===== 그림 위 마우스 조작 ===== */
function bindStage(st) {
  let drag = null, lastTap = null;
  const pt = e => { const r = st.getBoundingClientRect(), s = scale(), it = item(); return { x:clamp((e.clientX - r.left) / s, 0, it.w), y:clamp((e.clientY - r.top) / s, 0, it.h) }; };
  st.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('textarea')) return;
    if (editId) { editId = null; e.preventDefault(); renderStage(); renderList(); return; }  // 입력 중이면 입력만 끝냄
    const it = item(), p = pt(e);
    const hd = e.target.closest('.hd'), bh = e.target.closest('.bh');
    const hits = bh ? [] : hitsAt(p);   // 잠기지 않은 개체, 작은 것부터
    if (bh) {
      drag = { kind:'bresize', h:bh.dataset.bh, cx:e.clientX, cy:e.clientY, o:{ w:it.w, h:it.h, ...offOf(it) }, moved:false };
    } else if (baseSel && !tool) {
      // 바탕 그림이 선택된 상태: 끌면 그림을 옮기고, 클릭만 하면 그 자리 개체를 선택
      drag = { kind:'bmove', cx:e.clientX, cy:e.clientY, o:offOf(it), moved:false, switchTo:hits[0] || null };

    } else if (hits.length) {
      // 이미 선택한 개체 위를 누르면 그 개체를 옮길 수 있게 둠.
      // 끌지 않고 클릭만 하면: 더 작은 개체가 있으면 그쪽으로, 같은 자리를 다시 클릭하면 아래 개체로.
      const sb = selBox(), i = sb ? hits.indexOf(sb) : -1;

        if (again && hits.length > 1) { switchTo = hits[(i + 1) % hits.length]; cycled = true; }
        else if (i > 0) switchTo = hits[0];

      const b = selBox(); drag = { kind:'move', b, o:mmBox(it, b), start:p, moved:false, switchTo, cycled };
    } else if (doc.view === 'a4') {

      // 여기서 다시 그리면 끌기가 끊기므로 선택 표시는 손을 뗀 뒤에 그림
      if (selId) { selId = null; drawHandles(); }
      baseSel = true; st.classList.add('basesel');
      drag = { kind:'bmove', cx:e.clientX, cy:e.clientY, o:offOf(it), moved:false };
      lastTap = null;
    } else {
      if (selId) select(null);
      lastTap = null;
      return;
    }
    st.setPointerCapture(e.pointerId); e.preventDefault();
    $('#desk').focus({ preventScroll:true });
  });

async function editSticker(b, tab = 'crop') {

  const sx = m.w / oldR.w, sy = m.h / oldR.h;
  let nw = newR.w * sx, nh = newR.h * sy, nx = m.x + (newR.x - oldR.x) * sx, ny = m.y + (newR.y - oldR.y) * sy;

  const b = { id:uid(), shape:'pic', img, fx:r4((it.w - w) / 2 / it.w), fy:r4((it.h - h) / 2 / it.h), fw:r4(w / it.w), fh:r4(h / it.h) };

async function importLibrary(file) {
  try {
    const o = JSON.parse(await file.text());
    if (!Array.isArray(o.entries)) throw 0;
    let n = 0;
    for (const e of o.entries) {
      let ne;
      const id = library.some(x => x.id === e.id) ? uid() : (e.id || uid());
      if (e.kind === 'box' && e.box) ne = { id, kind:'box', name:e.name || '가져온 글상자', created:e.created || Date.now(), box:e.box };
      else if (e.kind === 'pic' && e.img) ne = { id, kind:'pic', name:e.name || '가져온 그림', created:e.created || Date.now(), img:e.img, wmm:e.wmm };
      else if (e.item && e.item.img) ne = { id, name:e.name || '가져온 항목', created:e.created || Date.now(), item:migrate({ items:[e.item] }).items[0] };
      else continue;
      await idbDo('lib', 'readwrite', st => st.put(ne));
      library.push(ne); n++;
    }
    library.sort((a, b) => b.created - a.created); renderList();
    toast(`보관함에 ${n}개를 가져왔습니다`);
  } catch (er) { toast('보관함 파일 형식이 아닙니다'); }
}

function stickerRatio(b) {
  const it = item(); if (!it || b?.shape !== 'pic') return;
  pushUndo(); const mm = mmBox(it, b); const h = Math.min(mm.w * b.img.ph / b.img.pw, it.h - mm.y);
  b.fh = r4(h / it.h); b.fw = r4(h * b.img.pw / b.img.ph / it.w); renderStage(); renderPanel(); persist();
}

function sizeHtml() { const it = item(), m = mmBox(it, selBox()); return `<div class="mini">
  <div class="row">너비 <input type="number" id="rgW" step="0.5" min="2" value="${r1(m.w)}"></div>
  <div class="row">높이 <input type="number" id="rgH" step="0.5" min="2" value="${r1(m.h)}"></div></div>`; }
function sizeBind() {
  ['rgW', 'rgH'].forEach(id => { const inp = $('#' + id);
    inp.addEventListener('focus', () => pushUndo(), { once:true });
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value), b = selBox(), it = item(); if (!(v >= 2) || !b) return;
      const mm = mmBox(it, b);
      if (id === 'rgW') mm.w = Math.min(v, it.w - mm.x); else mm.h = Math.min(v, it.h - mm.y);

function liveColor(el, apply) {

}

/* ▾ 메뉴: 탭의 명령을 글자 목록으로 (한글의 펼침 메뉴처럼) */
function openTabMenu(id, anchor) {
  const tab = TABS.find(t => t.id === id); if (!tab) return;
  const rows = [];
  tab.groups.forEach(g => { if (!g.cmds) return; if (rows.length) rows.push('-'); g.cmds.forEach(k => rows.push(k)); });
  closeMenu();
  const m = document.createElement('div');
  m.className = 'ctxmenu'; m.id = 'ctxmenu'; m.setAttribute('role', 'menu');
  m.innerHTML = rows.map(k => { if (k === '-') return '<hr>'; const c = CMD[k], dis = c.enabled && !c.enabled();
    return `<button type="button" role="menuitem" data-m="${k}" ${dis ? 'disabled' : ''}><span class="mi">${ic(c.icon)}${c.label}</span><kbd>${c.key || ''}</kbd></button>`; }).join('');
  document.body.appendChild(m);
  const rc = anchor.getBoundingClientRect();
  m.style.left = Math.min(rc.left, innerWidth - m.offsetWidth - 6) + 'px'; m.style.top = rc.bottom + 2 + 'px';
  m.querySelector('button:not(:disabled)')?.focus();
  m.addEventListener('click', ev => { const k = ev.target.closest('[data-m]'); if (!k || k.disabled) return; closeMenu(); act(k.dataset.m); });
  m.addEventListener('keydown', ev => {
    const bs = [...m.querySelectorAll('button:not(:disabled)')], i = bs.indexOf(document.activeElement);
    if (ev.key === 'ArrowDown') { ev.preventDefault(); bs[(i + 1) % bs.length]?.focus(); }
    if (ev.key === 'ArrowUp') { ev.preventDefault(); bs[(i - 1 + bs.length) % bs.length]?.focus(); }
    if (ev.key === 'Escape') { ev.preventDefault(); closeMenu(); }
    ev.stopPropagation();
  });
}

/* 눈금자: mm 단위, 10mm마다 cm 숫자. 그림(또는 A4 본문) 자리는 흰색, 선택한 개체 자리는 파란색 */
function drawRulers() {
  if (!ui.rulers) return;
  const desk = $('#desk'), H = $('#rulerH'), V = $('#rulerV'), it = item();
  const dpr = window.devicePixelRatio || 1;
  const prep = (cv, w, h) => { cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr)); const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); return g; };
  const hw = H.clientWidth, vh = V.clientHeight, T = 20;
  const gh = prep(H, hw, T), gv = prep(V, T, vh);
  const css = getComputedStyle(document.documentElement);
  const bg = css.getPropertyValue('--chrome-2').trim(), ink = css.getPropertyValue('--ink-3').trim(), ink2 = css.getPropertyValue('--ink-2').trim();
  [[gh, hw, T], [gv, T, vh]].forEach(([g, w, h]) => { g.fillStyle = bg; g.fillRect(0, 0, w, h); });
  if (!it || !stageEl) return;
  const s = scale(), dr = desk.getBoundingClientRect();
  const page = document.querySelector('.a4page');
  const org = (page || stageEl).getBoundingClientRect();
  const ox = org.left - dr.left, oy = org.top - dr.top;
  // 흰 영역
  const white = page ? { x:A4.left, y:A4.top, w:A4.w - A4.left * 2, h:A4.h - A4.top - 30 } : { x:0, y:0, w:it.w, h:it.h };
  gh.fillStyle = '#fff'; gh.fillRect(ox + white.x * s, 2, white.w * s, T - 4);
  gv.fillStyle = '#fff'; gv.fillRect(2, oy + white.y * s, T - 4, white.h * s);
  // 선택한 개체
  const b = selBox();
  if (b) {
    const o = offOf(it), m = mmBox(it, b), bx = page ? A4.left + o.x : 0, by = page ? A4.top + o.y : 0;
    gh.fillStyle = 'rgba(47,128,255,.28)'; gh.fillRect(ox + (bx + m.x) * s, 2, m.w * s, T - 4);
    gv.fillStyle = 'rgba(47,128,255,.28)'; gv.fillRect(2, oy + (by + m.y) * s, T - 4, m.h * s);
  }
  if (page && baseSel) {
    const o = offOf(it); gh.fillStyle = 'rgba(47,128,255,.28)'; gh.fillRect(ox + (A4.left + o.x) * s, 2, it.w * s, T - 4);
    gv.fillStyle = 'rgba(47,128,255,.28)'; gv.fillRect(2, oy + (A4.top + o.y) * s, T - 4, it.h * s);
  }
  const step = s >= 2.5 ? 1 : s >= 1 ? 2 : 5;
  const labelStep = s * 10 >= 30 ? 10 : s * 10 >= 15 ? 20 : 50;
  const ticks = (g, len, o, horiz) => {
    g.strokeStyle = ink; g.fillStyle = ink2; g.lineWidth = 1; g.font = '9px sans-serif'; g.textBaseline = 'top';
    const a = Math.floor(-o / s / step) * step, z = Math.ceil((len - o) / s);
    g.beginPath();
    for (let mm = a; mm <= z; mm += step) {
      const p = Math.round(o + mm * s) + .5, L = mm % 10 === 0 ? 8 : mm % 5 === 0 ? 5 : 3;
      if (horiz) { g.moveTo(p, T); g.lineTo(p, T - L); } else { g.moveTo(T, p); g.lineTo(T - L, p); }
      if (mm > 0 && mm % labelStep === 0) {
        const t = String(Math.abs(mm / 10));
        if (horiz) g.fillText(t, p + 2, 2); else { g.save(); g.translate(2, p + 2); g.fillText(t, 0, 0); g.restore(); }
      }
    }
    g.stroke();
  };
  ticks(gh, hw, ox, true); ticks(gv, vh, oy, false);
}
$('#desk').addEventListener('scroll', drawRulers);

function shapeAction(kind) {

}
function addBox(shape, r) {

  if (shape === 'mos') {
    const b = { ...geo, level:4 };

  }

  if (shape === 'ell') { b.align = 'CENTER'; b.valign = 'CENTER'; }
  it.boxes.push(b);
  tool = null; selId = b.id; editId = b.id;
  renderAll(); persist();
}

  if (which === 'w') { it.w = v; if (it.lock !== false) it.h = r1(v * ar); }
  else { it.h = v; if (it.lock !== false) it.w = r1(v / ar); }

}

document.addEventListener('keydown', e => {
  if (document.querySelector('.modal')) return;   // 배경 지우기 창이 열려 있으면 편집기 단축키는 쉼
  if (e.key === 'Escape' && document.querySelector('#ctxmenu')) { closeMenu(); return; }
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); exportHwpx(); return; }
  if (e.key === 'F1') { e.preventDefault(); openHelp(); return; }
  if (mod && k === 'b' && isText(selBox())) { e.preventDefault(); applyStyle({ bold:!selBox().bold }); return; }
  const t = e.target, typing = t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && !['checkbox','range'].includes(t.type));
  if (typing) return;
  const b = selBox(), it = item();
  if (mod && k === 'd' && b) { e.preventDefault(); duplicateBox(b); }
  else if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  else if (k === 'escape') { if (tool) { tool = null; renderStage(); renderRibbon(); renderPanel(); } else if (selId) select(null); else if (baseSel) selectBase(false); }
  else if (k.startsWith('arrow') && baseSel && !b) {
    e.preventDefault(); if (!e.repeat) pushUndo();
    const st = e.shiftKey ? 5 : 0.5, o = offOf(it);
    const n = clampOff(it, o.x + (k === 'arrowleft' ? -st : k === 'arrowright' ? st : 0), o.y + (k === 'arrowup' ? -st : k === 'arrowdown' ? st : 0));
    it.offX = n.x; it.offY = n.y; renderStage(); renderStatus(); persist();
  }
  else if (k === 'tab' && it && it.boxes.length && (document.activeElement === document.body || document.activeElement?.id === 'desk')) {
    e.preventDefault();
    const list = objOrder(it), i = list.indexOf(b);
    const nb = list[(i + (e.shiftKey ? -1 : 1) + list.length + (i < 0 && e.shiftKey ? 1 : 0)) % list.length];
    select(nb.id);
  }
  else if ((k === 'delete' || k === 'backspace') && b) { e.preventDefault(); if (b.locked) toast('잠긴 개체입니다. 오른쪽 버튼 → 잠금 풀기'); else deleteBox(); }
  else if ((k === 'enter' || k === 'f2') && b) { e.preventDefault(); startEdit(b.id); }
  else if (k.startsWith('arrow') && b && !b.locked) {
    e.preventDefault();
    if (!e.repeat) pushUndo();
    const st = e.shiftKey ? 5 : 0.5, m = mmBox(it, b);
    if (k === 'arrowleft') m.x -= st; if (k === 'arrowright') m.x += st; if (k === 'arrowup') m.y -= st; if (k === 'arrowdown') m.y += st;
    b.fx = r4(clamp(m.x, 0, it.w - m.w) / it.w); b.fy = r4(clamp(m.y, 0, it.h - m.h) / it.h);
    renderStage(); renderPanel(); persist();
  }
  else if ((k === 'pagedown' || k === 'pageup') && doc.items.length) {
    cur = clamp(cur + (k === 'pagedown' ? 1 : -1), 0, doc.items.length - 1); selId = editId = null; tool = null; autoFit = true; renderAll();
  }
});
document.addEventListener('paste', e => {
  if (document.querySelector('.modal')) return;
  const t = e.target; if (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT') return;
  const files = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith('image/')).map(i => i.getAsFile());

function readImage(file, sticker) {
  return new Promise((res, rej) => {
    const rd = new FileReader(); rd.onerror = rej;
    rd.onload = () => {
      const im = new Image(); im.onerror = rej;
      im.onload = () => {
        let dataUrl = rd.result, mime = file.type, ext = { 'image/png':'png', 'image/jpeg':'jpg', 'image/gif':'gif', 'image/bmp':'bmp' }[mime];
        if (!ext) {
          const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
          c.getContext('2d').drawImage(im, 0, 0); dataUrl = c.toDataURL('image/png'); mime = 'image/png'; ext = 'png';
        }
        res({ dataUrl, mime, ext, pw:im.naturalWidth, ph:im.naturalHeight });
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}
async function addImages(files) {
  if (!files.length) return;
  const got = [];
  for (const f of files) { try { got.push(await readImage(f)); } catch (e) { toast(`${f.name || '그림'}을(를) 열 수 없습니다`); } }
  if (!got.length) return;
  pushUndo();
  const start = doc.items.length;
  got.forEach(img => { const w = r1(Math.min(img.pw / PX_PER_MM, BODY_W)); doc.items.push({ id:uid(), img, w, h:r1(w * img.ph / img.pw), boxes:[], checked:true }); });
  cur = start; selId = editId = null; tool = null; autoFit = true; curTab = 'input';
  renderAll(); persist();
  toast(got.length > 1 ? `그림 ${got.length}개를 넣었습니다` : '그림을 넣었습니다. 오른쪽에서 글상자 모양을 고르세요');
}

/* ===================================================================
   HWPX 만들기 — 그림 + 글상자(사각/원형)를 개체 묶기(hp:container)로 저장
   =================================================================== */
const HU = mm => Math.round(mm * MM2HU);
const ID = () => 1000000000 + Math.floor(Math.random() * 1000000000);
const PAIR = '<hc:scaMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/><hc:rotMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/>';

function buildHeader(charKeys, paraKeys) {
  let h = SKEL.header;
  h = h.replace(/<hh:fontface lang="([A-Z]+)" fontCnt="2">([\s\S]*?)<\/hh:fontface>/g, (m, lang, inner) =>
    `<hh:fontface lang="${lang}" fontCnt="3">${inner}<hh:font id="2" face="맑은 고딕" type="TTF" isEmbedded="0"><hh:typeInfo familyType="FCAT_GOTHIC" weight="6" proportion="4" contrast="0" strokeVariation="1" armStyle="1" letterform="1" midline="1" xHeight="1"/></hh:font></hh:fontface>`);
  const base = h.match(/<hh:charPr id="0"[\s\S]*?<\/hh:charPr>/)[0];
  const cb = +h.match(/<hh:charProperties itemCnt="(\d+)"/)[1];
  const chars = charKeys.map((k, i) => {
    const [font, size, bold, color] = k.split('|'), ref = FONT[font].ref;
    let x = base.replace('id="0"', `id="${cb + i}"`)
      .replace(/height="\d+"/, `height="${Math.round(parseFloat(size) * 100)}"`)
      .replace(/textColor="#[0-9A-Fa-f]{6}"/, `textColor="${color.toUpperCase()}"`)
      .replace(/<hh:fontRef [^>]*\/>/, `<hh:fontRef hangul="${ref}" latin="${ref}" hanja="${ref}" japanese="${ref}" other="${ref}" symbol="${ref}" user="${ref}"/>`);
    if (bold === '1') x = x.replace('<hh:underline', '<hh:bold/><hh:underline');
    return x;
  });
  h = h.replace(/<hh:charProperties itemCnt="\d+">/, `<hh:charProperties itemCnt="${cb + chars.length}">`).replace('</hh:charProperties>', chars.join('') + '</hh:charProperties>');
  const pbase = h.match(/<hh:paraPr id="0"[\s\S]*?<\/hh:paraPr>/)[0];
  const pb = +h.match(/<hh:paraProperties itemCnt="(\d+)"/)[1];
  const paras = paraKeys.map((k, i) => {
    const [align, line] = k.split('|');
    return pbase.replace('id="0"', `id="${pb + i}"`).replace(/horizontal="[A-Z_]+"/, `horizontal="${align}"`)
      .replace(/<hh:lineSpacing type="PERCENT" value="\d+"/g, `<hh:lineSpacing type="PERCENT" value="${line}"`);
  });
  h = h.replace(/<hh:paraProperties itemCnt="\d+">/, `<hh:paraProperties itemCnt="${pb + paras.length}">`).replace('</hh:paraProperties>', paras.join('') + '</hh:paraProperties>');
  return { xml:h, cb, pb };
}
/* 위치·크기·변환 행렬. 묶음 안의 개체는 (x,y) 만큼 옮긴 이동 행렬을 가짐 */
function place(x, y, w, h, pairs) {
  return `<hp:offset x="${x}" y="${y}"/><hp:orgSz width="${w}" height="${h}"/><hp:curSz width="0" height="0"/><hp:flip horizontal="0" vertical="0"/>`
    + `<hp:rotationInfo angle="0" centerX="${Math.round(w / 2)}" centerY="${Math.round(h / 2)}" rotateimage="1"/>`
    + `<hp:renderingInfo><hc:transMatrix e1="1" e2="0" e3="${x}" e4="0" e5="1" e6="${y}"/>${PAIR.repeat(pairs)}</hp:renderingInfo>`;
}
/* 쪽에서 옮긴 그림은 ‘글자처럼 취급’ 대신 문단 기준 위치(가로: 본문 왼쪽, 세로: 문단 위)로 저장 */
const u32 = v => v < 0 ? 4294967296 + v : v;
function layout(w, h, it) {
  const o = it ? offOf(it) : { x:0, y:0 }, moved = Math.abs(o.x) > 0.05 || Math.abs(o.y) > 0.05;
  const pos = doc.inline && !moved
    ? `<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>`
    : `<hp:pos treatAsChar="0" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="${u32(HU(o.y))}" horzOffset="${u32(HU(o.x))}"/>`;
  return `<hp:sz width="${w}" widthRelTo="ABSOLUTE" height="${h}" heightRelTo="ABSOLUTE" protect="0"/>${pos}<hp:outMargin left="0" right="0" top="0" bottom="0"/>`;
}
function picBody(binId, img, w, h) {
  const dw = img.pw * 75, dh = img.ph * 75;
  return `<hc:img binaryItemIDRef="${binId}" bright="0" contrast="0" effect="REAL_PIC" alpha="0"/>`
    + `<hp:imgRect><hc:pt0 x="0" y="0"/><hc:pt1 x="${w}" y="0"/><hc:pt2 x="${w}" y="${h}"/><hc:pt3 x="0" y="${h}"/></hp:imgRect>`
    + `<hp:imgClip left="0" right="${dw}" top="0" bottom="${dh}"/><hp:inMargin left="0" right="0" top="0" bottom="0"/><hp:imgDim dimwidth="${dw}" dimheight="${dh}"/><hp:effects/>`;
}
function decoXML(b) {
  const on = b.stroke && b.stroke !== 'none';
  let x = `<hp:lineShape color="${on ? b.stroke : '#000000'}" width="${on ? Math.round(b.strokeW * MM2HU) : 33}" style="${on ? 'SOLID' : 'NONE'}" endCap="FLAT" headStyle="NORMAL" tailStyle="NORMAL" headfill="1" tailfill="1" headSz="MEDIUM_MEDIUM" tailSz="MEDIUM_MEDIUM" outlineStyle="NORMAL" alpha="0"/>`;
  if (b.fill && b.fill !== 'none') x += `<hc:fillBrush><hc:winBrush faceColor="${b.fill}" hatchColor="#000000" alpha="${Math.round((b.fillT || 0) * 255 / 100)}"/></hc:fillBrush>`;
  return x;
}
function textPart(b, w, charId, paraId) {
  const paras = fillVars(b.text).split('\n').map(l =>
    `<hp:p id="0" paraPrIDRef="${paraId}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="${charId}">${l ? `<hp:t>${esc(l)}</hp:t>` : '<hp:t/>'}</hp:run></hp:p>`).join('');
  return decoXML(b)
    + `<hp:shadow type="NONE" color="#B2B2B2" offsetX="0" offsetY="0" alpha="0"/>`
    + `<hp:drawText lastWidth="${w}" name="" editable="0"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="${b.valign}" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${paras}</hp:subList>`
    + `<hp:textMargin left="${HU(b.padL)}" right="${HU(b.padR)}" top="${HU(b.padT)}" bottom="${HU(b.padB)}"/></hp:drawText>`;
}
function objXML(it, binId, ids, dims, stk) {
  const W = HU(it.w), H = HU(it.h);
  const tbs = textBoxes(it);
  if (!tbs.length && !stk.length) {
    const id = ID();
    return `<hp:pic id="${id}" zOrder="0" numberingType="PICTURE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" href="" groupLevel="0" instid="${id - 1}" reverse="0">`
      + place(0, 0, W, H, 1) + picBody(binId, dims, W, H) + layout(W, H, it) + `<hp:shapeComment>그림입니다.</hp:shapeComment></hp:pic>`;
  }
  const child = z => `id="0" zOrder="${z}" numberingType="NONE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" href="" groupLevel="1"`;
  let kids = `<hp:pic ${child(0)} instid="${ID()}" reverse="0">${place(0, 0, W, H, 2)}${picBody(binId, dims, W, H)}</hp:pic>`;
  let z = 1;
  stk.forEach(({ b, binId:sid, dims:sd }) => {
    const x = clamp(HU(b.fx * it.w), 0, W), y = clamp(HU(b.fy * it.h), 0, H);
    const w = Math.max(1, Math.min(HU(b.fw * it.w), W - x)), h = Math.max(1, Math.min(HU(b.fh * it.h), H - y));
    kids += `<hp:pic ${child(z++)} instid="${ID()}" reverse="0">${place(x, y, w, h, 2)}${picBody(sid, sd, w, h)}</hp:pic>`;
  });
  tbs.forEach((b) => {
    const i = z++ - 1;
    const x = clamp(HU(b.fx * it.w), 0, W), y = clamp(HU(b.fy * it.h), 0, H);
    const w = Math.max(1, Math.min(HU(b.fw * it.w), W - x)), h = Math.max(1, Math.min(HU(b.fh * it.h), H - y));
    const { charId, paraId } = ids(b);
    if (b.shape === 'ell') {
      kids += `<hp:ellipse ${child(i + 1)} instid="${ID()}" intervalDirty="0" hasArcPr="0" arcType="NORMAL">${place(x, y, w, h, 2)}${textPart(b, w, charId, paraId)}`
        + `<hc:center x="${Math.round(w / 2)}" y="${Math.round(h / 2)}"/><hc:ax1 x="${w}" y="${Math.round(h / 2)}"/><hc:ax2 x="${Math.round(w / 2)}" y="0"/>`
        + `<hc:start1 x="0" y="0"/><hc:end1 x="0" y="0"/><hc:start2 x="0" y="0"/><hc:end2 x="0" y="0"/></hp:ellipse>`;
    } else {
      kids += `<hp:rect ${child(i + 1)} instid="${ID()}" ratio="0">${place(x, y, w, h, 2)}${textPart(b, w, charId, paraId)}`
        + `<hc:pt0 x="0" y="0"/><hc:pt1 x="${w}" y="0"/><hc:pt2 x="${w}" y="${h}"/><hc:pt3 x="0" y="${h}"/></hp:rect>`;
    }
  });
  const gid = ID();
  return `<hp:container id="${gid}" zOrder="0" numberingType="PICTURE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" href="" groupLevel="0" instid="${gid - 1}">`
    + place(0, 0, W, H, 1) + kids + layout(W, H, it) + `<hp:shapeComment>묶음 개체입니다.</hp:shapeComment></hp:container>`;
}
/* 얹은 그림: 문서에 놓이는 크기 기준 300dpi로 줄여 저장 (PNG 투명 유지) */
async function bakedSticker(it, b) {
  const img = b.img, tw = Math.round(b.fw * it.w / 25.4 * 300), th = Math.round(b.fh * it.h / 25.4 * 300);
  if (!doc.shrink || img.pw <= tw * 1.1 || img.ph <= th * 1.1) return { data:dataUrlBytes(img.dataUrl), mime:img.mime, ext:img.ext, pw:img.pw, ph:img.ph };
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = img.dataUrl; });
  const c = document.createElement('canvas'); c.width = tw; c.height = th;
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(im, 0, 0, tw, th);
  const jpg = img.mime === 'image/jpeg';
  return { data:dataUrlBytes(c.toDataURL(jpg ? 'image/jpeg' : 'image/png', 0.9)), mime:jpg ? 'image/jpeg' : 'image/png', ext:jpg ? 'jpg' : 'png', pw:tw, ph:th };
}
async function bakedImage(it) {
  const mos = it.boxes.filter(b => b.shape === 'mos');
  const t = targetPx(it), shrink = doc.shrink && it.img.pw > t.w * 1.1 && it.img.ph > t.h * 1.1;
  if (!mos.length && !shrink) return { data:dataUrlBytes(it.img.dataUrl), mime:it.img.mime, ext:it.img.ext, pw:it.img.pw, ph:it.img.ph };
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = it.img.dataUrl; });
  const W = shrink ? t.w : it.img.pw, H = shrink ? t.h : it.img.ph, k = W / it.img.pw;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(im, 0, 0, W, H);
  mos.forEach(b => {
    const sx = Math.round(b.fx * it.img.pw), sy = Math.round(b.fy * it.img.ph);
    const sw = Math.max(1, Math.round(b.fw * it.img.pw)), sh = Math.max(1, Math.round(b.fh * it.img.ph));
    pixelate(ctx, im, sx, sy, sw, sh, Math.round(b.fx * W), Math.round(b.fy * H), Math.max(1, Math.round(b.fw * W)), Math.max(1, Math.round(b.fh * H)), mosaicCell(it, b));
  });
  ctx.imageSmoothingEnabled = true;
  const jpg = it.img.mime === 'image/jpeg';
  const url = c.toDataURL(jpg ? 'image/jpeg' : 'image/png', 0.9);
  const out = { data:dataUrlBytes(url), mime:jpg ? 'image/jpeg' : 'image/png', ext:jpg ? 'jpg' : 'png', pw:W, ph:H };
  // 다시 저장했는데 오히려 커지면(드문 경우) 원본을 씀
  if (!mos.length && out.data.length > imgBytes(it)) return { data:dataUrlBytes(it.img.dataUrl), mime:it.img.mime, ext:it.img.ext, pw:it.img.pw, ph:it.img.ph };
  return out;
}
function todayStr() { const d = new Date(); return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`; }
const fillVars = t => (t || '').replace(/\{오늘\}/g, todayStr());
async function buildHwpx() {
  const ck = b => [b.font, b.size, b.bold ? 1 : 0, b.color].join('|'), pk = b => [b.align, b.line].join('|');
  const items = doc.items.filter(i => i.checked !== false);
  const boxes = items.flatMap(textBoxes);
  const charKeys = [...new Set(boxes.map(ck))], paraKeys = [...new Set(boxes.map(pk))];
  const hdr = buildHeader(charKeys, paraKeys);
  const ids = b => ({ charId:hdr.cb + charKeys.indexOf(ck(b)), paraId:hdr.pb + paraKeys.indexOf(pk(b)) });
  const enc = new TextEncoder(), bins = [];
  let paras = '';
  let nBin = 0;
  const addBin = bk => { const id = 'image' + (++nBin); bins.push({ id, path:`BinData/${id}.${bk.ext}`, mime:bk.mime, data:bk.data }); return id; };
  for (let i = 0; i < items.length; i++) {
