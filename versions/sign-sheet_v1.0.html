<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참석자 서명부</title>
<meta name="author" content="https://blog.naver.com/oderobong">
<style>

:root{
  --ink:#1c2430; --sub:#5b6573; --line:#dfe3e8; --paper:#f7f8f6; --card:#ffffff;
  --blue:#1565c0; --blue-soft:#e8f0fb; --red:#9b1c1c; --green:#1e5b33; --green-soft:#e6f4ea;
  --amber:#6b4e00; --amber-soft:#fff6e0; --err-soft:#fde8e8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
header{background:#fff;border-bottom:1px solid var(--line)}
.bar{height:6px;background:linear-gradient(90deg,var(--red) 0 18%,var(--blue) 18% 100%)}
.head{padding-top:26px;padding-bottom:20px}
.school{font-size:14px;color:var(--sub);margin:0 0 4px}
h1{font-size:30px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--sub);font-weight:500;font-size:18px;margin-left:8px;letter-spacing:0}
.lead{margin:10px 0 0;font-size:15px;color:var(--sub)}
.lead b{color:var(--ink)}

.engine{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 10px;background:#fff}
.engine .dot{width:9px;height:9px;border-radius:50%;background:#c3c8cf;flex:none}
.engine.loading .dot{background:var(--blue);animation:pulse 1.1s ease-in-out infinite}
.engine.ready .dot{background:#2e9d57}
.engine.fail .dot{background:var(--red)}
.engine.fail{border-color:#f0b9b9;background:var(--err-soft)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.engine.loading .dot{animation:none}}

main.wrap{padding-top:20px;padding-bottom:44px}
.drop{background:#fff;border:2px dashed #b9c6d8;border-radius:14px;padding:30px 20px;text-align:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop h2{margin:0 0 4px;font-size:20px;font-weight:800}
.drop p{margin:0 0 16px;color:var(--sub);font-size:14.5px}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:9px;padding:8px 16px;cursor:pointer}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{font-size:13.5px;padding:4px 11px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn:focus-visible,.link:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.fsa{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:14px;color:var(--sub)}
.fsa .btn{margin-bottom:6px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);margin-top:6px}

.summary{display:none;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:20px 0 10px}
.summary.on{display:flex}
.summary .cnt{font-size:14.5px;margin-right:auto}
.summary .cnt b{font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px}
.row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.st{font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;min-width:64px;text-align:center}
.st.wait{background:#eef0f3;color:var(--sub)}
.st.run{background:var(--blue-soft);color:var(--blue)}
.st.ok{background:var(--green-soft);color:var(--green)}
.st.skip{background:#eef0f3;color:var(--sub)}
.st.fail{background:var(--err-soft);color:var(--red)}
.nm{min-width:0}
.nm .f{font-weight:700;word-break:break-all;line-height:1.35}
.nm .d{font-size:12.5px;color:var(--sub);word-break:break-all}
.nm .why{font-size:13px;margin-top:3px;color:var(--red)}
.act{white-space:nowrap}
@media (max-width:560px){
  h1{font-size:24px} h1 span{display:block;margin:4px 0 0}
  .row{grid-template-columns:1fr auto}
  .row .st{grid-column:1/-1;justify-self:start}
}

.info{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 18px}
.info details{border-bottom:1px solid var(--line);padding:10px 0}
.info details:last-child{border-bottom:0}
.info summary{cursor:pointer;font-weight:700;font-size:15px}
.info summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.info ul{margin:8px 0 4px;padding-left:20px;font-size:14.5px;color:#333c48}
.info li{margin:3px 0}
.info p{margin:8px 0 4px;font-size:14.5px;color:#333c48}
.info a,.link{color:var(--blue)}
footer{border-top:1px solid var(--line);background:#fff;padding:18px 0 26px;font-size:13px;color:var(--sub)}
footer p{margin:0 0 4px}
kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fafbfc}

/* ===== 한글 도구 모음 공통 덧붙임 (v2026-11) ===== */
.schoolchip{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--sub);background:#f1f6f1;border:1px solid #dbe8db;border-radius:10px;padding:5px 12px}
.schoolchip b{color:var(--ink)}
.schoolchip button{font:inherit;font-size:13px;color:var(--blue);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:16px}
.card h2{font-size:17px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--sub)}
.f input,.f select,.f textarea,.inp{font:inherit;font-size:15px;color:var(--ink);border:1px solid #cbd3dd;border-radius:8px;padding:7px 10px;background:#fff}
textarea.inp,.f textarea{min-height:120px;resize:vertical;line-height:1.5}
.f.wide{grid-column:1/-1}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0}
.opts label{display:inline-flex;align-items:center;gap:6px;font-size:14.5px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.hint{font-size:13.5px;color:var(--sub);margin:6px 0 0}
.warn{font-size:13.5px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:8px 12px;margin-top:10px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{font-size:13px;color:var(--sub);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:6px 8px;border-bottom:1px solid #eef0f3;vertical-align:middle}
table.t td input{width:100%;font:inherit;font-size:14.5px;border:1px solid #d5dbe3;border-radius:6px;padding:4px 8px}
.mvb{font:inherit;font-size:11px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:1px 6px;cursor:pointer;color:var(--sub)}
.x{font:inherit;border:0;background:none;color:#9aa3ae;font-size:18px;cursor:pointer;line-height:1}
.x:hover{color:var(--red)}
.pv{margin-top:16px;background:#e9ecef;border-radius:12px;padding:12px;overflow:auto;max-height:80vh}
.pv iframe{width:100%;height:75vh;border:0;background:#fff;border-radius:6px}
.pv .rp{background:transparent}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1c2430;color:#fff;border-radius:10px;padding:10px 18px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:.95}
dialog.sd{border:0;border-radius:14px;padding:22px 24px;max-width:520px;width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog.sd h2{margin:0 0 12px;font-size:18px}
dialog.sd::backdrop{background:rgba(20,28,40,.35)}
.paste{min-height:140px;border:1px solid #cbd3dd;border-radius:10px;padding:10px 12px;background:#fff;font-size:14.5px;overflow:auto;max-height:340px;outline:none}
.paste:empty::before{content:attr(data-ph);color:#9aa3ae}
.paste:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
/* HWPX 미리보기(ENG.previewHwpx) */
.rp{display:flex;flex-direction:column;align-items:center;gap:18px}
.rp-page{background:#fff;color:#111;box-shadow:0 2px 10px rgba(20,30,50,.2);position:relative;font-family:"함초롬돋움","HCR Dotum","Malgun Gothic",sans-serif;font-size:10pt;flex:none}
.rp-page .pgno{position:absolute;top:6pt;right:8pt;font:11px sans-serif;color:#99a}
.rp-page p{margin:0}
</style>
</head>
<body>
<header>
  <div class="bar"></div>
  <div class="wrap head">
    <p class="school">업무 도구 · <span id="ver"></span></p>
    <h1>참석자 서명부<span>연수·협의회·회의</span></h1>
    <p class="lead">명단을 붙여 넣으면 서명 칸이 있는 <b>한글 파일(.hwpx)</b>을 만듭니다. 명단이 길면 다음 쪽으로 이어집니다.</p>
    <div id="schoolHost"></div>
  </div>
</header>
<main class="wrap">
  <section class="card">
    <h2>1. 행사 정보</h2>
    <div class="grid">
      <label class="f wide"><span>제목</span><input id="title" value="교직원 연수 참석자 서명부"></label>
      <label class="f wide"><span>부제목 (비우면 없음)</span><input id="sub" placeholder="예: 2026학년도 개인정보보호 연수"></label>
      <label class="f"><span>일시</span><input id="when" placeholder="2026. 11. 26.(목) 15:00"></label>
      <label class="f"><span>장소</span><input id="place" placeholder="시청각실"></label>
      <label class="f"><span>확인자 (맨 아래, 비우면 없음)</span><input id="sign" placeholder="담당자 홍길동"></label>
    </div>
  </section>
  <section class="card">
    <h2>2. 명단</h2>
    <div class="grid">
      <label class="f wide"><span>한 줄에 한 명. 엑셀에서 칸째 복사: <b>성명</b> / <b>직위·성명</b> / <b>소속·직위·성명</b></span>
        <textarea id="people" rows="8">교무부	교사	김민수
교무부	교사	이영희
행정실	주무관	홍길동</textarea></label>
      <label class="f"><span>빈 줄 더 넣기</span><input id="blank" type="number" min="0" value="5"></label>
      <label class="f"><span>칸</span><select id="cols"><option value="full">연번·소속·직위·성명·서명·비고</option><option value="mid">연번·직위·성명·서명·비고</option><option value="min">연번·성명·서명</option></select></label>
    </div>
    <div class="acts">
      <button class="btn primary" type="button" id="dl">한글 파일 받기 (.hwpx)</button>
      <button class="btn" type="button" id="pvBtn">미리보기</button>
    </div>
  </section>
  <div id="pv"></div>
  <section class="info" aria-label="안내"><details><summary>만든 사람</summary><p><a class="link" href="https://blog.naver.com/oderobong" target="_blank" rel="noopener">blog.naver.com/oderobong</a> · 학교운영위원회 운영업무 도우미의 위원 출석 등록부와 같은 코드를 씁니다.</p></details></section>
</main>

<script>
const TOOL = {name:"참석자 서명부", version:"1.0", date:"2026-11-11"};
/* ===== [공유] 학교 정보 — 원본: school-tool/src/shared/school_info.js =====
   같은 주소(wonwongemini-ctrl.github.io) 아래 도구들이 브라우저 저장 공간 하나를 같이 쓴다.
   한 도구에서 학교명·주소 등을 넣으면 다른 도구(학운위 운영업무 도우미 포함)에서도 바로 쓴다.
   PC에 내려받은 파일로 열면 파일마다 따로 저장된다(브라우저 규칙). */
const SCHOOL_INFO = {
  key: "schooltools_school",
  FIELDS: {name:"학교명", addr:"주소", tel:"전화", fax:"팩스", home:"홈페이지", email:"전자우편"},
  get(){ try{ return JSON.parse(localStorage.getItem(this.key) || "{}") || {}; }catch(e){ return {}; } },
  set(o){
    const cur = this.get(), n = {...cur};
    for(const k in this.FIELDS){ if(o[k] !== undefined) n[k] = String(o[k] || "").trim(); }
    n.at = new Date().toISOString();
    try{ localStorage.setItem(this.key, JSON.stringify(n)); }catch(e){}
    return n;
  }
};

" charPrIDRef=\"3\" nextStyleIDRef=\"15\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"16\" type=\"PARA\" name=\"미주\" engName=\"Endnote\" paraPrIDRef=\"10\" charPrIDRef=\"3\" nextStyleIDRef=\"16\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"17\" type=\"PARA\" name=\"메모\" engName=\"Memo\" paraPrIDRef=\"11\" charPrIDRef=\"4\" nextStyleIDRef=\"17\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"18\" type=\"PARA\" name=\"차례 제목\" engName=\"TOC Heading\" paraPrIDRef=\"12\" charPrIDRef=\"5\" nextStyleIDRef=\"18\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"19\" type=\"PARA\" name=\"차례 1\" engName=\"TOC 1\" paraPrIDRef=\"13\" charPrIDRef=\"6\" nextStyleIDRef=\"19\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"20\" type=\"PARA\" name=\"차례 2\" engName=\"TOC 2\" paraPrIDRef=\"14\" charPrIDRef=\"6\" nextStyleIDRef=\"20\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"21\" type=\"PARA\" name=\"차례 3\" engName=\"TOC 3\" paraPrIDRef=\"15\" charPrIDRef=\"6\" nextStyleIDRef=\"21\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"22\" type=\"PARA\" name=\"캡션\" engName=\"Caption\" paraPrIDRef=\"19\" charPrIDRef=\"0\" nextStyleIDRef=\"22\" langID=\"1042\" lockForm=\"0\"/><\/hh:styles><\/hh:refList><hh:compatibleDocument targetProgram=\"HWP201X\"><hh:layoutCompatibility/><\/hh:compatibleDocument><hh:docOption><hh:linkinfo path=\"\" pageInherit=\"0\" footnoteInherit=\"0\"/><\/hh:docOption><hh:metaTag>{\"name\":\"\"}<\/hh:metaTag><hh:trackchageConfig flags=\"56\"/><\/hh:head>"}, "secHead": "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\" ?><hs:sec xmlns:ha=\"http://www.hancom.co.kr/hwpml/2011/app\" xmlns:hp=\"http://www.hancom.co.kr/hwpml/2011/paragraph\" xmlns:hp10=\"http://www.hancom.co.kr/hwpml/2016/paragraph\" xmlns:hs=\"http://www.hancom.co.kr/hwpml/2011/section\" xmlns:hc=\"http://www.hancom.co.kr/hwpml/2011/core\" xmlns:hh=\"http://www.hancom.co.kr/hwpml/2011/head\" xmlns:hhs=\"http://www.hancom.co.kr/hwpml/2011/history\" xmlns:hm=\"http://www.hancom.co.kr/hwpml/ ewNum=\"1\"/><hp:placement place=\"END_OF_DOCUMENT\" beneathText=\"0\"/><\/hp:endNotePr><hp:pageBorderFill type=\"BOTH\" borderFillIDRef=\"1\" textBorder=\"PAPER\" headerInside=\"0\" footerInside=\"0\" fillArea=\"PAPER\"><hp:offset left=\"1417\" right=\"1417\" top=\"1417\" bottom=\"1417\"/><\/hp:pageBorderFill><hp:pageBorderFill type=\"EVEN\" borderFillIDRef=\"1\" textBorder=\"PAPER\" headerInside=\"0\" footerInside=\"0\" fillArea=\"PAPER\"><hp:offset left=\"1417\" right=\"1417\" top=\"1417\" bottom=\"1417\"/><\/hp:pageBorderFill><hp:pageBorderFill type=\"ODD\" borderFillIDRef=\"1\" textBorder=\"PAPER\" headerInside=\"0\" footerInside=\"0\" fillArea=\"PAPER\"><hp:offset left=\"1417\" right=\"1417\" top=\"1417\" bottom=\"1417\"/><\/hp:pageBorderFill><\/hp:secPr><hp:ctrl><hp:colPr id=\"\" type=\"NEWSPAPER\" layout=\"LEFT\" colCount=\"1\" sameSz=\"1\" sameGap=\"0\"/><\/hp:ctrl><\/hp:run>"};
const ENG = (() => {
  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* 블록 빌더 */
  const B = {
    title: t => ({ k: 'p', t, cp: 'title', al: 'c' }),
    big: t => ({ k: 'p', t, cp: 'big', al: 'c' }),
    sub: t => ({ k: 'p', t, cp: 'sub', al: 'c' }),
    h: t => ({ k: 'p', t, cp: 'h', al: 'j' }),
    p: (t, lv = 0) => ({ k: 'p', t, cp: 'body', al: 'j', lv }),
    b: (t, lv = 0) => ({ k: 'p', t, cp: 'bold', al: 'j', lv }),
    c: (t, cp = 'body') => ({ k: 'p', t, cp, al: 'c' }),
    r: (t, cp = 'body') => ({ k: 'p', t, cp, al: 'r' }),
    letter: (t, al = 'j') => ({ k: 'p', t, cp: 'letter', al, lh: 1 }),
    sign: t => ({ k: 'p', t, cp: 'sign', al: 'c' }),
    note: (t, lv = 0) => ({ k: 'p', t, cp: 'note', al: 'j', lv }),
    sp: () => ({ k: 'p', t: '', cp: 'body', al: 'j' }),
    pb: () => ({ k: 'pb' }),
    /* rows: 셀 = 문자열 | {t, h, cs, rs, al} ; opt: {w:[비율], head:n(머리행 수), rowH, width(0~1)} */
    /* 정밀 서식 표: cols(pt), rows[{h(pt), cells[{p, cs, rs, va, fill, diag, m}]}], hl/vl 선 목록 */
    form: (spec) => ({ k: 'form', ...spec }),
    /* 크기 지정 문단: {t|runs, sz, b, f, al, ls, l, r, ind, prev} */
    pp: (spec) => ({ k: 'pp', ...spec }),
    tbl: (w, rows, opt = {}) => ({ k: 'tbl', w, rows, head: opt.head ?? 1, rowH: opt.rowH, width: opt.width ?? 1, al: opt.al, split: !!opt.split }),
  };

  /* 셀 정규화 + 격자 배치 */
  function layout(tb) {
    const rows = tb.rows.map((r, ri) => r.map(c => {
      const o = typeof c === 'object' && c !== null ? { ...c } : { t: c };
      o.t = o.t ?? ''; o.cs = o.cs || 1; o.rs = o.rs || 1;
      if (o.h === undefined) o.h = ri < tb.head;
      return o;
    }));
    const ncol = tb.w.length, occ = [];
    rows.forEach((r, ri) => {
      occ[ri] = occ[ri] || [];
      let col = 0;
      r.forEach(c => {
        while (occ[ri][col]) col++;
        c.col = col; c.row = ri;
        for (let a = 0; a < c.rs; a++) for (let b = 0; b < c.cs; b++) {
          occ[ri + a] = occ[ri + a] || []; occ[ri + a][col + b] = (a || b) ? 'x' : c;
        }
        col += c.cs;
      });
    });
    return { rows, ncol, nrow: rows.length, occ };
  }

  /* 날짜·학교장·위원장 명의 줄은 가운데 정렬 */
  const DATE_RE = /^\s*(\d{4}\s*[.년]|년\s{2,}월\s{2,}일)/, SIGNER_RE = /(학\s*교\s*장|위\s*원\s*장)\s*(\(인\)|\(위원장인\))?\s*$/;
  const centerFix = bk => (bk && bk.k === 'p' && bk.al === 'r' && (DATE_RE.test(bk.t || '') || (SIGNER_RE.test(bk.t || '') && !/성명|후보자|기록자|추천자|동의자/.test(bk.t)))) ? { ...bk, al: 'c', cp: bk.cp === 'body' && SIGNER_RE.test(bk.t) ? 'sign' : bk.cp } : bk;
  const isDate = b => b && b.k === 'p' && b.al === 'c' && DATE_RE.test(b.t || '');
  const isSign = b => b && b.k === 'p' && (b.cp === 'sign' || (b.al === 'c' && SIGNER_RE.test(b.t || '')));
  const fixAll = blocks => {
    const arr = blocks.map(b => b.k === 'close' ? { ...b, blocks: fixAll(b.blocks) } : centerFix(b)), out = [];
    for (let i = 0; i < arr.length; i++) {
      const b = arr[i]; out.push(b);
      if (isDate(b)) { let j = i + 1; while (j < arr.length && arr[j].k === 'p' && !arr[j].t) j++; if (isSign(arr[j])) { out.push({ k: 'p', t: '', cp: 'body', al: 'c' }, { k: 'p', t: '', cp: 'body', al: 'c' }); i = j - 1; } }
    }
    return out;
  }; // 날짜와 학교명(명의) 사이 두 줄, 모두 가운데
  /* ---------- HTML 미리보기 ---------- */
  function html(blocks) {
    return fixAll(blocks).map(bk => {
      if (bk.k === 'pb') return '<div class="pv-pb"><span>쪽 나눔</span></div>';
      if (bk.k === 'form') return formHtml(bk);
      if (bk.k === 'close') return `<div class="pv-close">${html(bk.blocks)}</div>`;
      if (bk.k === 'pp') return paraHtml(bk, 10);
      if (bk.k === 'p') {
        const cls = `pv-p pv-${bk.cp} pv-al-${bk.al} pv-lv${bk.lv || 0}`;
        return `<p class="${cls}">${bk.t ? esc(bk.t).replace(/\n/g, '<br>') : '&nbsp;'}</p>`;
      }
      const L = layout(bk), tot = bk.w.reduce((a, b) => a + b, 0);
      let h = `<table class="pv-t" style="width:${Math.round(bk.width * 100)}%"><colgroup>${bk.w.map(x => `<col style="width:${(x / tot * 100).toFixed(2)}%">`).join('')}</colgroup>`;
      L.rows.forEach(r => {
        h += '<tr>' + r.map(c => `<td${c.cs > 1 ? ` colspan="${c.cs}"` : ''}${c.rs > 1 ? ` rowspan="${c.rs}"` : ''} class="${c.h ? 'th' : ''} al-${c.al || (c.h ? 'c' : 'c')}"${bk.rowH ? ` style="height:${bk.rowH / 100}px"` : ''}>${esc(c.t).replace(/\n/g, '<br>') || '&nbsp;'}</td>`).join('') + '</tr>';
      });
      return h + '</table>';
    }).join('');
  }

  /* ---------- HWPX 공통: 동적 스타일 ---------- */
  let pid = 0, DYN, BW = 425.2, BH = 657.6;
  const maxId = (h, tag) => { let m = -1; h.replace(new RegExp(`<hh:${tag} id="(\\d+)"`, 'g'), (x, n) => { m = Math.max(m, +n); }); return m; };
  function dynInit(hdr = HWPX_TPL.files['Contents/header.xml'], base = { cp: 7, pp: 20, keepFont: false }) {
    DYN = { hdr, base, cp: new Map(), pp: new Map(), bf: new Map(), cpX: [], ppX: [], bfX: [], cpN: maxId(hdr, 'charPr') + 1, ppN: maxId(hdr, 'paraPr') + 1, bfN: maxId(hdr, 'borderFill') + 1 };
  }
  const tplPart = (tag, id) => { const m = DYN.hdr.match(new RegExp(`<hh:${tag} id="${id}"[\\s\\S]*?</hh:${tag}>`)); if (m) return m[0]; return DYN.hdr.match(new RegExp(`<hh:${tag} id="\\d+"[\\s\\S]*?</hh:${tag}>`))[0]; };
  function cpId(sz, b, f = 0, sp = 0, ra = 100) {
    const k = [sz, b ? 1 : 0, f, sp, ra].join('|'); if (DYN.cp.has(k)) return DYN.cp.get(k);
    const id = DYN.cpN++;
    let x = tplPart('charPr', DYN.base.cp).replace(/^<hh:charPr id="\d+"/, `<hh:charPr id="${id}"`).replace(/height="\d+"/, `height="${Math.round(sz * 100)}"`).replace(/<hh:bold\/>/g, '').replace(/<hh:italic\/>/g, '');
    if (!DYN.base.keepFont) x = x.replace(/<hh:fontRef [^>]*\/>/, `<hh:fontRef hangul="${f}" latin="${f}" hanja="${f}" japanese="${f}" other="${f}" symbol="${f}" user="${f}"/>`);
    x = x.replace(/<hh:ratio [^>]*\/>/, `<hh:ratio hangul="${ra}" latin="${ra}" hanja="${ra}" japanese="${ra}" other="${ra}" symbol="${ra}" user="${ra}"/>`);
    x = x.replace(/<hh:spacing [^>]*\/>/, `<hh:spacing hangul="${sp}" latin="${sp}" hanja="${sp}" japanese="${sp}" other="${sp}" symbol="${sp}" user="${sp}"/>`);
    if (b) x = x.replace('<hh:underline', '<hh:bold/><hh:underline');
    DYN.cpX.push(x); DYN.cp.set(k, id); return id;
  }
  const ALN = { c: 'CENTER', l: 'LEFT', r: 'RIGHT', j: 'JUSTIFY', d: 'CENTER' }; // 배분 정렬은 한글에서 치우쳐 보여 가운데 정렬로 통일
  function ppId(al = 'j', ls = 160, l = 0, r = 0, ind = 0, prev = 0, next = 0, sq = false) {
    if (al === 'j') al = 'l'; // HWPX 산출물: 양쪽 정렬 → 왼쪽 정렬
    [l, r, ind, prev, next] = [l, r, ind, prev, next].map(v => Math.round(v * 10) / 10);
    const k = [al, ls, l, r, ind, prev, next, sq ? 1 : 0].join('|'); if (DYN.pp.has(k)) return DYN.pp.get(k);
    const id = DYN.ppN++;
    let x = tplPart('paraPr', DYN.base.pp).replace(/^<hh:paraPr id="\d+"/, `<hh:paraPr id="${id}"`).replace(/horizontal="[A-Z_]+"/, `horizontal="${ALN[al] || 'JUSTIFY'}"`)
      .replace(/(<hh:lineSpacing type=")[A-Z_]+(" value=")-?\d+/g, `$1PERCENT$2${Math.round(ls)}`)
      .replace(/lineWrap="[A-Z_]+"/g, `lineWrap="${sq ? 'SQUEEZE' : 'BREAK'}"`); // SQUEEZE = 한글 '한 줄로 입력'
    const set = (str, dv) => str.replace(/<hc:intent value="-?\d+"/g, `<hc:intent value="${Math.round(ind * 100 / dv)}"`).replace(/<hc:left value="-?\d+"/g, `<hc:left value="${Math.round(l * 100 / dv)}"`)
      .replace(/<hc:right value="-?\d+"/g, `<hc:right value="${Math.round(r * 100 / dv)}"`).replace(/<hc:prev value="-?\d+"/g, `<hc:prev value="${Math.round(prev * 100 / dv)}"`).replace(/<hc:next value="-?\d+"/g, `<hc:next value="${Math.round(next * 100 / dv)}"`);
    if (x.includes('<hp:default>')) { const parts = x.split('<hp:default>'); parts[0] = set(parts[0], 2); parts[1] = set(parts[1], 1); x = parts.join('<hp:default>'); } else x = set(x, 1);
    DYN.ppX.push(x); DYN.pp.set(k, id); return id;
  }
  const MMW = [0.1, 0.12, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 1.0, 1.5, 2.0];
  const mmW = pt => { const mm = pt * 0.3528; let best = MMW[0]; MMW.forEach(v => { if (Math.abs(v - mm) < Math.abs(best - mm)) best = v; }); return (best % 1 ? String(best) : best.toFixed(1)) + ' mm'; };
  function bfId(sd, fill, diag, split) {
    const k = JSON.stringify([sd, fill, diag, !!split]); if (DYN.bf.has(k)) return DYN.bf.get(k);

    dl.querySelector("[data-ok]").onclick = () => { const o = {}; dl.querySelectorAll("[data-k]").forEach(i => o[i.dataset.k] = i.value); SCHOOL_INFO.set(o); dl.close(); dl.remove(); draw(); if(onChange) onChange(); toast("학교 정보를 저장했습니다"); };
  };
  draw();
  window.addEventListener("storage", e => { if(e.key === SCHOOL_INFO.key){ draw(); if(onChange) onChange(); } });
}
/* 끌어다 놓기 칸 연결: el, 파일 입력, onFiles(파일 배열) */
function wireDrop(el, input, onFiles){
  ["dragenter","dragover"].forEach(t => el.addEventListener(t, e => { e.preventDefault(); el.classList.add("over"); }));
  ["dragleave","drop"].forEach(t => el.addEventListener(t, e => { e.preventDefault(); if(t === "drop" || !el.contains(e.relatedTarget)) el.classList.remove("over"); }));
  el.addEventListener("drop", e => { if(e.dataTransfer.files.length) onFiles([...e.dataTransfer.files]); });
  document.addEventListener("dragover", e => e.preventDefault()); document.addEventListener("drop", e => e.preventDefault());
  input.addEventListener("change", () => { if(input.files.length) onFiles([...input.files]); input.value = ""; });
}
/* HTML 인쇄물 미리보기(iframe) */
function showHtmlPreview(host, html){ host.innerHTML = `<div class="pv"><iframe title="미리보기"></iframe></div>`; host.querySelector("iframe").srcdoc = html; }
async function showHwpxPreview(host, blob){ host.innerHTML = `<div class="pv"><div class="rp">${await ENG.previewHwpx(blob)}</div></div>`; ENG.fitSqueeze(host); }
$("ver").textContent = `v${TOOL.version} (${TOOL.date})`;
const KEEP = ["title","sub","when","place","sign","people","blank","cols"], KEY = "schooltools_signsheet";
try{ const o = JSON.parse(localStorage.getItem(KEY) || "{}"); KEEP.forEach(k => { if(o[k] != null) $(k).value = o[k]; }); }catch(e){}
document.querySelectorAll("main input, main textarea, main select").forEach(e => e.addEventListener("input", () => { const o = {}; KEEP.forEach(k => o[k] = $(k).value); try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(_){} }));
$("people").addEventListener("keydown", e => { if(e.key === "Tab"){ e.preventDefault(); e.target.setRangeText("\t", e.target.selectionStart, e.target.selectionEnd, "end"); } });
schoolChip("schoolHost");
const COLS = {full:{head:["연번","소속","직위","성명","서명","비고"], w:[8,16,14,15,24,14]}, mid:{head:["연번","직위","성명","서명","비고"], w:[8,18,18,28,18]}, min:{head:["연번","성명","서명"], w:[10,30,50]}};
function blocks(){
  const c = COLS[$("cols").value];
  const ppl = $("people").value.split("\n").map(l => l.split("\t").map(x => x.trim())).filter(r => r.some(Boolean)).map(r => {
    while(r.length && !r[r.length-1]) r.pop();
    if(r.length === 1 && /\s/.test(r[0])){ const t = r[0].split(/\s+/); return t.length >= 3 ? {org:t[0], pos:t.slice(1,-1).join(" "), name:t[t.length-1]} : {org:"", pos:t[0], name:t[1]}; }
    return r.length >= 3 ? {org:r[0], pos:r[1], name:r.slice(2).join(" ")} : r.length === 2 ? {org:"", pos:r[0], name:r[1]} : {org:"", pos:"", name:r[0]};
  });
  const n = Math.max(0, +$("blank").value||0);
  const all = [...ppl, ...Array.from({length:n}, () => ({org:"", pos:"", name:""}))];
  const row = (p, i) => { const no = String(i+1); return $("cols").value === "full" ? [no, p.org, p.pos, p.name, "", ""] : $("cols").value === "mid" ? [no, p.pos, p.name, "", ""] : [no, p.name, ""]; };
  const info = [$("when").value.trim() && `○ 일시: ${$("when").value.trim()}`, $("place").value.trim() && `○ 장소: ${$("place").value.trim()}`];
  const s = SCHOOL_INFO.get();
  return signSheetBlocks({title:$("title").value.trim() || "참석자 서명부", sub:$("sub").value.trim(), info, head:c.head, widths:c.w, rows:all.map(row), rowH:2600, split:true,
    foot:[`○ 인원: ${ppl.length}명`], sign: $("sign").value.trim() ? `${$("sign").value.trim()}　　　(서명)` : (s.name ? "" : "")});
}
const make = () => ENG.hwpx(blocks(), $("title").value.trim() || "참석자 서명부", {noFill:true, pageNum:true});
$("dl").onclick = async () => { try{ save(await make(), `${($("title").value.trim() || "참석자 서명부").replace(/[\\/:*?"<>|]/g, "")}.hwpx`); }catch(e){ console.error(e); alert("만들지 못했어요: " + (e.message || e)); } };
$("pvBtn").onclick = async () => { try{ await showHwpxPreview($("pv"), await make()); }catch(e){ console.error(e); $("pv").innerHTML = `<p class="warn">${esc(e.message || e)}</p>`; } };
</script>
