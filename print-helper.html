<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출력 도우미 — 명패·라벨·견출지·등록부</title>
<meta name="author" content="https://blog.naver.com/oderobong">
<style>

:root{
  --ink:#1c2430; --sub:#5b6573; --line:#dfe3e8; --paper:#f7f8f6; --card:#ffffff;
  --blue:#1565c0; --blue-soft:#e8f0fb; --red:#9b1c1c; --green:#1e5b33; --green-soft:#e6f4ea;
  --amber:#6b4e00; --amber-soft:#fff6e0; --err-soft:#fde8e8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
header{background:#fff;border-bottom:1px solid var(--line)}
.bar{height:6px;background:linear-gradient(90deg,var(--red) 0 18%,var(--blue) 18% 100%)}
.head{padding-top:26px;padding-bottom:20px}
.school{font-size:14px;color:var(--sub);margin:0 0 4px}
h1{font-size:30px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--sub);font-weight:500;font-size:18px;margin-left:8px;letter-spacing:0}
.lead{margin:10px 0 0;font-size:15px;color:var(--sub)}
.lead b{color:var(--ink)}

.engine{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 10px;background:#fff}
.engine .dot{width:9px;height:9px;border-radius:50%;background:#c3c8cf;flex:none}
.engine.loading .dot{background:var(--blue);animation:pulse 1.1s ease-in-out infinite}
.engine.ready .dot{background:#2e9d57}
.engine.fail .dot{background:var(--red)}
.engine.fail{border-color:#f0b9b9;background:var(--err-soft)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.engine.loading .dot{animation:none}}

main.wrap{padding-top:20px;padding-bottom:44px}
.drop{background:#fff;border:2px dashed #b9c6d8;border-radius:14px;padding:30px 20px;text-align:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop h2{margin:0 0 4px;font-size:20px;font-weight:800}
.drop p{margin:0 0 16px;color:var(--sub);font-size:14.5px}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:9px;padding:8px 16px;cursor:pointer}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{font-size:13.5px;padding:4px 11px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn:focus-visible,.link:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.fsa{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:14px;color:var(--sub)}
.fsa .btn{margin-bottom:6px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);margin-top:6px}

.summary{display:none;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:20px 0 10px}
.summary.on{display:flex}
.summary .cnt{font-size:14.5px;margin-right:auto}
.summary .cnt b{font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px}
.row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.st{font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;min-width:64px;text-align:center}
.st.wait{background:#eef0f3;color:var(--sub)}
.st.run{background:var(--blue-soft);color:var(--blue)}
.st.ok{background:var(--green-soft);color:var(--green)}
.st.skip{background:#eef0f3;color:var(--sub)}
.st.fail{background:var(--err-soft);color:var(--red)}
.nm{min-width:0}
.nm .f{font-weight:700;word-break:break-all;line-height:1.35}
.nm .d{font-size:12.5px;color:var(--sub);word-break:break-all}
.nm .why{font-size:13px;margin-top:3px;color:var(--red)}
.act{white-space:nowrap}
@media (max-width:560px){
  h1{font-size:24px} h1 span{display:block;margin:4px 0 0}
  .row{grid-template-columns:1fr auto}
  .row .st{grid-column:1/-1;justify-self:start}
}

.info{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 18px}
.info details{border-bottom:1px solid var(--line);padding:10px 0}
.info details:last-child{border-bottom:0}
.info summary{cursor:pointer;font-weight:700;font-size:15px}
.info summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.info ul{margin:8px 0 4px;padding-left:20px;font-size:14.5px;color:#333c48}
.info li{margin:3px 0}
.info p{margin:8px 0 4px;font-size:14.5px;color:#333c48}
.info a,.link{color:var(--blue)}
footer{border-top:1px solid var(--line);background:#fff;padding:18px 0 26px;font-size:13px;color:var(--sub)}
footer p{margin:0 0 4px}
kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fafbfc}

/* ===== 한글 도구 모음 공통 덧붙임 (v2026-11) ===== */
.schoolchip{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--sub);background:#f1f6f1;border:1px solid #dbe8db;border-radius:10px;padding:5px 12px}
.schoolchip b{color:var(--ink)}
.schoolchip button{font:inherit;font-size:13px;color:var(--blue);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:16px}
.card h2{font-size:17px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--sub)}
.f input,.f select,.f textarea,.inp{font:inherit;font-size:15px;color:var(--ink);border:1px solid #cbd3dd;border-radius:8px;padding:7px 10px;background:#fff}
textarea.inp,.f textarea{min-height:120px;resize:vertical;line-height:1.5}
.f.wide{grid-column:1/-1}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0}
.opts label{display:inline-flex;align-items:center;gap:6px;font-size:14.5px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.hint{font-size:13.5px;color:var(--sub);margin:6px 0 0}
.warn{font-size:13.5px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:8px 12px;margin-top:10px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{font-size:13px;color:var(--sub);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:6px 8px;border-bottom:1px solid #eef0f3;vertical-align:middle}
table.t td input{width:100%;font:inherit;font-size:14.5px;border:1px solid #d5dbe3;border-radius:6px;padding:4px 8px}
.mvb{font:inherit;font-size:11px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:1px 6px;cursor:pointer;color:var(--sub)}
.x{font:inherit;border:0;background:none;color:#9aa3ae;font-size:18px;cursor:pointer;line-height:1}
.x:hover{color:var(--red)}
.pv{margin-top:16px;background:#e9ecef;border-radius:12px;padding:12px;overflow:auto;max-height:80vh}
.pv iframe{width:100%;height:75vh;border:0;background:#fff;border-radius:6px}
.pv .rp{background:transparent}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1c2430;color:#fff;border-radius:10px;padding:10px 18px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:.95}
dialog.sd{border:0;border-radius:14px;padding:22px 24px;max-width:520px;width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog.sd h2{margin:0 0 12px;font-size:18px}
dialog.sd::backdrop{background:rgba(20,28,40,.35)}
.paste{min-height:140px;border:1px solid #cbd3dd;border-radius:10px;padding:10px 12px;background:#fff;font-size:14.5px;overflow:auto;max-height:340px;outline:none}
.paste:empty::before{content:attr(data-ph);color:#9aa3ae}
.paste:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
/* HWPX 미리보기(ENG.previewHwpx) */
.rp{display:flex;flex-direction:column;align-items:center;gap:18px}
.rp-page{background:#fff;color:#111;box-shadow:0 2px 10px rgba(20,30,50,.2);position:relative;font-family:"함초롬돋움","HCR Dotum","Malgun Gothic",sans-serif;font-size:10pt;flex:none}
.rp-page .pgno{position:absolute;top:6pt;right:8pt;font:11px sans-serif;color:#99a}
.rp-page p{margin:0}
</style>
<style>
/* ===== 출력 도우미: 왼쪽 질문 · 오른쪽 미리보기 ===== */
:root{--accent:#1f5e74;--accent-soft:#e3eef1;--muted:#5b6970;--line2:#dde3e0;--line-strong:#b9c3bf;--ok:#1d7a4c;--ok-soft:#e2f2e9;--warn:#9a6200;--warn-soft:#fbf0d9;--err:#b3261e;--paper:#f4f6f5}
body{background:var(--paper);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line2);flex:none}
.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.02em}
.top h1 span{font-size:13.5px;font-weight:500;margin-left:8px}
.top .sp{flex:1}
.top .schoolchip{margin:0}
.app{flex:1;display:grid;grid-template-columns:minmax(380px,440px) 1fr;min-height:0}
.left{display:flex;flex-direction:column;min-height:0;background:var(--paper);border-right:1px solid var(--line2)}
.steps{display:flex;gap:4px;padding:12px 18px 0;flex-wrap:wrap}
.steps button{font:inherit;font-size:12.5px;font-weight:700;border:1.5px solid var(--line2);background:#fff;color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
.steps button[aria-current="step"]{border-color:var(--accent);background:var(--accent);color:#fff}
.steps button.done{color:var(--accent);border-color:#bcd3da}
.steps button:disabled{opacity:.45;cursor:default}
.prog{height:3px;background:var(--line2);margin:10px 18px 0;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.pane{flex:1;overflow:auto;padding:4px 18px 18px}
.q{font-size:24px;line-height:1.35;letter-spacing:-.025em;margin:18px 0 6px;font-weight:700}
.qs{margin:0 0 16px;color:var(--muted);font-size:14.5px}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;width:100%;border:1.5px solid var(--line2);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink)}
.choice:hover{border-color:var(--line-strong)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice:disabled{cursor:default;opacity:.55}
.choice .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:18px}
.choice[aria-pressed="true"] .ic{background:var(--accent);color:#fff}
.choice b{display:block;font-size:15.5px}
.choice .d{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.choice .tag{font-size:11.5px;font-weight:700;color:var(--muted);background:#eef0f2;border-radius:6px;padding:1px 7px}
.designs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.design{border:1.5px solid var(--line2);background:#fff;border-radius:12px;padding:8px;cursor:pointer;font:inherit;text-align:center;color:var(--ink)}
.design[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.design .th{height:66px;overflow:hidden;position:relative;border-radius:6px;background:#fff;pointer-events:none}
.design .th iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}
.design b{display:block;font-size:13.5px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
textarea.names{width:100%;min-height:150px;font:inherit;font-size:15.5px;line-height:1.6;border:1.5px solid var(--line-strong);border-radius:12px;padding:10px 12px;resize:vertical}
textarea.names:focus,.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.ex{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.ex b{font-size:13px}
.ex summary{cursor:pointer}
.ex .r{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:6px;align-items:center}
.ex code{font:inherit;font-weight:600;background:#f3f5f4;border-radius:5px;padding:0 6px;white-space:nowrap}
.minidrop{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line-strong);border-radius:12px;padding:9px 12px;margin-top:10px;background:#fff;cursor:pointer;font-size:14px;color:var(--muted)}
.minidrop.over{border-color:var(--accent);background:var(--accent-soft)}
.minidrop b{color:var(--ink)}
.read{margin-top:14px}
.read h3{font-size:14.5px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.read table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.read th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:5px 8px;background:#f7f8f7;border-bottom:1px solid var(--line2)}
.read td{padding:5px 8px;border-bottom:1px solid #eef0f0}
.read td.n{color:#9aa4a8;font-size:12px;width:24px}
.read td.nm{font-weight:700}
.read .tt{font-weight:700;letter-spacing:.2em}
.colmap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:0 0 8px}
.colmap select{font:inherit;font-size:13px;border:1px solid var(--line-strong);border-radius:6px;padding:1px 4px}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.inp{font:inherit;font-size:15.5px;border:1.5px solid var(--line-strong);border-radius:10px;padding:8px 12px;width:100%;background:#fff}
.done-head{display:flex;align-items:center;gap:10px;margin:18px 0 6px}
.done-head .ck{width:34px;height:34px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:800}
.outs{display:grid;gap:8px;margin-top:8px}
.outs .btn{width:100%;padding:11px 14px;text-align:left;display:flex;justify-content:space-between;align-items:center;border-radius:12px}
.outs .btn small{font-weight:500;opacity:.8;font-size:12.5px;text-align:right}
.outs .btn{border:1.5px solid var(--accent);color:var(--accent);background:#fff}
.outs .btn:hover{background:var(--accent-soft)}
.outs .btn.busy{opacity:.7;cursor:progress}
.btn.primary{background:var(--accent);border-color:var(--accent)}
details.more{margin-top:14px;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:8px 12px}
details.more summary{cursor:pointer;font-weight:700;font-size:14px}
details.more .grid{margin-top:10px;grid-template-columns:1fr 1fr}
.fixes{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.cta{flex:none;display:flex;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--line2);background:var(--paper)}
.cta .btn{flex:1;padding:10px 14px;border-radius:12px}
.cta .btn.back{flex:0 0 auto}
.right{min-width:0;min-height:0;display:flex;flex-direction:column;background:#e6e9ec}
.rhead{display:flex;align-items:center;gap:8px;padding:8px 12px 0;flex:none}
.rhead .t{font-size:13px;font-weight:700;color:var(--muted)}
.vtabs{display:flex;gap:4px}
.vtabs button{font:inherit;font-size:12.5px;font-weight:700;border:1px solid #c5ccd2;background:#fff;color:var(--muted);border-radius:7px;padding:2px 10px;cursor:pointer}
.vtabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
#pickHint{color:#b5541f;font-weight:600}
.choice .ck2{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:14px;color:#fff}
.choice[aria-pressed="true"] .ck2{background:var(--accent);border-color:var(--accent)}
.papers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paper{border:1.5px solid var(--line2);background:#fff;border-radius:12px;padding:10px;cursor:pointer;font:inherit;text-align:left;color:var(--ink);display:flex;gap:10px;align-items:center}
.paper[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.paper .gr{width:36px;height:50px;border:1px solid #9aa4a8;background:#fff;display:grid;gap:1.5px;padding:2px;flex:none}
.paper .gr i{background:#cfdde2;border-radius:1px}
.paper b{display:block;font-size:14px}.paper span{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:13.5px;color:var(--muted);margin:12px 0 4px;display:block;font-weight:600}
.group{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:12px;margin-top:10px}
.group h3{margin:0 0 8px;font-size:15.5px;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:8px}
.group h3 .pill{flex:none}
.group .outs{margin-top:0}
.bgrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.bgthumb{width:44px;height:30px;object-fit:cover;border-radius:5px;border:1px solid var(--line2)}
/* 미리보기(자) */
.ppv{flex:1;display:flex;flex-direction:column;min-height:0;padding:6px 12px 12px}
.ppv-bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ppv-zoom{display:inline-flex;background:#fff;border:1px solid #cdd3d8;border-radius:8px;overflow:hidden}
.ppv-zoom button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:none;padding:3px 10px;cursor:pointer;color:var(--muted)}
.ppv-zoom button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ppv-info{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ppv-grid{flex:1;min-height:0;display:grid;grid-template-columns:20px 1fr;grid-template-rows:20px 1fr;border:1px solid #c5ccd2;border-radius:6px;overflow:hidden;background:#d0d5da}
.ppv-corner{font-size:8.5px;color:#6b7480;display:grid;place-items:center;background:#d9dde2;border-right:1px solid #c5ccd2;border-bottom:1px solid #c5ccd2}
.ppv-rt{border-bottom:1px solid #c5ccd2;display:block}
.ppv-rl{border-right:1px solid #c5ccd2;display:block}
.ppv-view{overflow:auto;position:relative;background:#cfd4d9}
.ppv-stage{position:relative;margin:0 auto}
.ppv-f{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:transparent}
.pvtoggle{display:none}
@media (max-width:900px){
  body{height:auto;overflow:auto}
  .app{grid-template-columns:1fr}
  .left{border-right:0}
  .right{height:72vh}
  .top h1 span{display:none}
  .pvtoggle{display:block}
  .top h1{white-space:nowrap;font-size:18px}
  .top .schoolchip>span{display:none}
}
.foot{font-size:12px;color:var(--muted);padding:6px 18px 10px}
.foot a{color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <h1>출력 도우미<span>명패 · 라벨 · 견출지 · 등록부</span></h1>
  <div class="sp"></div>
  <div id="schoolHost"></div>
</div>
<div class="app">
  <section class="left" aria-label="질문">
    <nav class="steps" id="steps" aria-label="단계"></nav>

<script>
const TOOL = {name:"출력 도우미", version:"1.0", date:"2026-11-12"};
/* ===== [공유] 학교 정보 — 원본: school-tool/src/shared/school_info.js =====
   같은 주소(wonwongemini-ctrl.github.io) 아래 도구들이 브라우저 저장 공간 하나를 같이 쓴다.
   한 도구에서 학교명·주소 등을 넣으면 다른 도구(학운위 운영업무 도우미 포함)에서도 바로 쓴다.
   PC에 내려받은 파일로 열면 파일마다 따로 저장된다(브라우저 규칙). */
const SCHOOL_INFO = {
  key: "schooltools_school",
  FIELDS: {name:"학교명", addr:"주소", tel:"전화", fax:"팩스", home:"홈페이지", email:"전자우편"},
  get(){ try{ return JSON.parse(localStorage.getItem(this.key) || "{}") || {}; }catch(e){ return {}; } },
  set(o){
    const cur = this.get(), n = {...cur};
    for(const k in this.FIELDS){ if(o[k] !== undefined) n[k] = String(o[k] || "").trim(); }
    n.at = new Date().toISOString();
    try{ localStorage.setItem(this.key, JSON.stringify(n)); }catch(e){}
    return n;
  }
};
/* ===== [공유] HWPX 문서 엔진 — 원본: school-tool/src/shared/hwpx_engine.js =====
 이 파일은 한글 도구 모음(school-tool)이 원본이다. 학교운영위원회 운영업무 도우미 등은 빌드할 때 이 파일을 가져와 넣는다.
 블록 빌더(ENG.B)로 문서를 블록 목록으로 만들고 ENG.hwpx(blocks, 제목, 옵션)으로 .hwpx(Blob)를 만든다.

" charPrIDRef=\"3\" nextStyleIDRef=\"15\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"16\" type=\"PARA\" name=\"미주\" engName=\"Endnote\" paraPrIDRef=\"10\" charPrIDRef=\"3\" nextStyleIDRef=\"16\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"17\" type=\"PARA\" name=\"메모\" engName=\"Memo\" paraPrIDRef=\"11\" charPrIDRef=\"4\" nextStyleIDRef=\"17\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"18\" type=\"PARA\" name=\"차례 제목\" engName=\"TOC Heading\" paraPrIDRef=\"12\" charPrIDRef=\"5\" nextStyleIDRef=\"18\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"19\" type=\"PARA\" name=\"차례 1\" engName=\"TOC 1\" paraPrIDRef=\"13\" charPrIDRef=\"6\" nextStyleIDRef=\"19\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"20\" type=\"PARA\" name=\"차례 2\" engName=\"TOC 2\" paraPrIDRef=\"14\" charPrIDRef=\"6\" nextStyleIDRef=\"20\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"21\" type=\"PARA\" name=\"차례 3\" engName=\"TOC 3\" paraPrIDRef=\"15\" charPrIDRef=\"6\" nextStyleIDRef=\"21\" langID=\"1042\" lockForm=\"0\"/><hh:style id=\"22\" type=\"PARA\" name=\"캡션\" engName=\"Caption\" paraPrIDRef=\"19\" charPrIDRef=\"0\" nextStyleIDRef=\"22\" langID=\"1042\" lockForm=\"0\"/><\/hh:styles><\/hh:refList><hh:compatibleDocument targetProgram=\"HWP201X\"><hh:layoutCompatibility/><\/hh:compatibleDocument><hh:docOption><hh:linkinfo path=\"\" pageInherit=\"0\" footnoteInherit=\"0\"/><\/hh:docOption><hh:metaTag>{\"name\":\"\"}<\/hh:metaTag><hh:trackchageConfig flags=\"56\"/><\/hh:head>"}, "secHead": "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\" ?><hs:sec xmlns:ha=\"http://www.hancom.co.kr/hwpml/2011/app\" xmlns:hp=\"http://www.hancom.co.kr/hwpml/2011/paragraph\" xmlns:hp10=\"http://www.hancom.co.kr/hwpml/2016/paragraph\" xmlns:hs=\"http://www.hancom.co.kr/hwpml/2011/section\" xmlns:hc=\"http://www.hancom.co.kr/hwpml/2011/core\" xmlns:hh=\"http://www.hancom.co.kr/hwpml/2011/head\" xmlns:hhs=\"http://www.hancom.co.kr/hwpml/2011/history\" xmlns:hm=\"http://www.hancom.co.kr/hwpml/ ewNum=\"1\"/><hp:placement place=\"END_OF_DOCUMENT\" beneathText=\"0\"/><\/hp:endNotePr><hp:pageBorderFill type=\"BOTH\" borderFillIDRef=\"1\" textBorder=\"PAPER\" headerInside=\"0\" footerInside=\"0\" fillArea=\"PAPER\"><hp:offset left=\"1417\" right=\"1417\" top=\"1417\" bottom=\"1417\"/><\/hp:pageBorderFill><hp:pageBorderFill type=\"EVEN\" borderFillIDRef=\"1\" textBorder=\"PAPER\" headerInside=\"0\" footerInside=\"0\" fillArea=\"PAPER\"><hp:offset left=\"1417\" right=\"1417\" top=\"1417\" bottom=\"1417\"/><\/hp:pageBorderFill><hp:pageBorderFill type=\"ODD\" borderFillIDRef=\"1\" textBorder=\"PAPER\" headerInside=\"0\" footerInside=\"0\" fillArea=\"PAPER\"><hp:offset left=\"1417\" right=\"1417\" top=\"1417\" bottom=\"1417\"/><\/hp:pageBorderFill><\/hp:secPr><hp:ctrl><hp:colPr id=\"\" type=\"NEWSPAPER\" layout=\"LEFT\" colCount=\"1\" sameSz=\"1\" sameGap=\"0\"/><\/hp:ctrl><\/hp:run>"};
const ENG = (() => {
  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* 블록 빌더 */
  const B = {
    title: t => ({ k: 'p', t, cp: 'title', al: 'c' }),
    big: t => ({ k: 'p', t, cp: 'big', al: 'c' }),
    sub: t => ({ k: 'p', t, cp: 'sub', al: 'c' }),
    h: t => ({ k: 'p', t, cp: 'h', al: 'j' }),
    p: (t, lv = 0) => ({ k: 'p', t, cp: 'body', al: 'j', lv }),
    b: (t, lv = 0) => ({ k: 'p', t, cp: 'bold', al: 'j', lv }),
    c: (t, cp = 'body') => ({ k: 'p', t, cp, al: 'c' }),
    r: (t, cp = 'body') => ({ k: 'p', t, cp, al: 'r' }),
    letter: (t, al = 'j') => ({ k: 'p', t, cp: 'letter', al, lh: 1 }),
    sign: t => ({ k: 'p', t, cp: 'sign', al: 'c' }),
    note: (t, lv = 0) => ({ k: 'p', t, cp: 'note', al: 'j', lv }),
    sp: () => ({ k: 'p', t: '', cp: 'body', al: 'j' }),
    pb: () => ({ k: 'pb' }),
    /* rows: 셀 = 문자열 | {t, h, cs, rs, al} ; opt: {w:[비율], head:n(머리행 수), rowH, width(0~1)} */
    /* 정밀 서식 표: cols(pt), rows[{h(pt), cells[{p, cs, rs, va, fill, diag, m}]}], hl/vl 선 목록 */
    form: (spec) => ({ k: 'form', ...spec }),
    /* 크기 지정 문단: {t|runs, sz, b, f, al, ls, l, r, ind, prev} */
    pp: (spec) => ({ k: 'pp', ...spec }),
    tbl: (w, rows, opt = {}) => ({ k: 'tbl', w, rows, head: opt.head ?? 1, rowH: opt.rowH, width: opt.width ?? 1, al: opt.al, split: !!opt.split }),
  };

  /* 셀 정규화 + 격자 배치 */
  function layout(tb) {
    const rows = tb.rows.map((r, ri) => r.map(c => {
      const o = typeof c === 'object' && c !== null ? { ...c } : { t: c };
      o.t = o.t ?? ''; o.cs = o.cs || 1; o.rs = o.rs || 1;
      if (o.h === undefined) o.h = ri < tb.head;
      return o;
    }));
    const ncol = tb.w.length, occ = [];
    rows.forEach((r, ri) => {
      occ[ri] = occ[ri] || [];
      let col = 0;
      r.forEach(c => {
        while (occ[ri][col]) col++;
        c.col = col; c.row = ri;
        for (let a = 0; a < c.rs; a++) for (let b = 0; b < c.cs; b++) {
          occ[ri + a] = occ[ri + a] || []; occ[ri + a][col + b] = (a || b) ? 'x' : c;
        }
        col += c.cs;
      });
    });
    return { rows, ncol, nrow: rows.length, occ };
  }

  /* 날짜·학교장·위원장 명의 줄은 가운데 정렬 */
  const DATE_RE = /^\s*(\d{4}\s*[.년]|년\s{2,}월\s{2,}일)/, SIGNER_RE = /(학\s*교\s*장|위\s*원\s*장)\s*(\(인\)|\(위원장인\))?\s*$/;
  const centerFix = bk => (bk && bk.k === 'p' && bk.al === 'r' && (DATE_RE.test(bk.t || '') || (SIGNER_RE.test(bk.t || '') && !/성명|후보자|기록자|추천자|동의자/.test(bk.t)))) ? { ...bk, al: 'c', cp: bk.cp === 'body' && SIGNER_RE.test(bk.t) ? 'sign' : bk.cp } : bk;
  const isDate = b => b && b.k === 'p' && b.al === 'c' && DATE_RE.test(b.t || '');
  const isSign = b => b && b.k === 'p' && (b.cp === 'sign' || (b.al === 'c' && SIGNER_RE.test(b.t || '')));
  const fixAll = blocks => {
    const arr = blocks.map(b => b.k === 'close' ? { ...b, blocks: fixAll(b.blocks) } : centerFix(b)), out = [];
    for (let i = 0; i < arr.length; i++) {
      const b = arr[i]; out.push(b);
      if (isDate(b)) { let j = i + 1; while (j < arr.length && arr[j].k === 'p' && !arr[j].t) j++; if (isSign(arr[j])) { out.push({ k: 'p', t: '', cp: 'body', al: 'c' }, { k: 'p', t: '', cp: 'body', al: 'c' }); i = j - 1; } }
    }
    return out;
  }; // 날짜와 학교명(명의) 사이 두 줄, 모두 가운데
  /* ---------- HTML 미리보기 ---------- */
  function html(blocks) {
    return fixAll(blocks).map(bk => {
      if (bk.k === 'pb') return '<div class="pv-pb"><span>쪽 나눔</span></div>';
      if (bk.k === 'form') return formHtml(bk);
      if (bk.k === 'close') return `<div class="pv-close">${html(bk.blocks)}</div>`;
      if (bk.k === 'pp') return paraHtml(bk, 10);
      if (bk.k === 'p') {
        const cls = `pv-p pv-${bk.cp} pv-al-${bk.al} pv-lv${bk.lv || 0}`;
        return `<p class="${cls}">${bk.t ? esc(bk.t).replace(/\n/g, '<br>') : '&nbsp;'}</p>`;
      }
      const L = layout(bk), tot = bk.w.reduce((a, b) => a + b, 0);
      let h = `<table class="pv-t" style="width:${Math.round(bk.width * 100)}%"><colgroup>${bk.w.map(x => `<col style="width:${(x / tot * 100).toFixed(2)}%">`).join('')}</colgroup>`;
      L.rows.forEach(r => {
        h += '<tr>' + r.map(c => `<td${c.cs > 1 ? ` colspan="${c.cs}"` : ''}${c.rs > 1 ? ` rowspan="${c.rs}"` : ''} class="${c.h ? 'th' : ''} al-${c.al || (c.h ? 'c' : 'c')}"${bk.rowH ? ` style="height:${bk.rowH / 100}px"` : ''}>${esc(c.t).replace(/\n/g, '<br>') || '&nbsp;'}</td>`).join('') + '</tr>';
      });
      return h + '</table>';
    }).join('');
  }

  /* ---------- HWPX 공통: 동적 스타일 ---------- */
  let pid = 0, DYN, BW = 425.2, BH = 657.6;
  const maxId = (h, tag) => { let m = -1; h.replace(new RegExp(`<hh:${tag} id="(\\d+)"`, 'g'), (x, n) => { m = Math.max(m, +n); }); return m; };
  function dynInit(hdr = HWPX_TPL.files['Contents/header.xml'], base = { cp: 7, pp: 20, keepFont: false }) {
    DYN = { hdr, base, cp: new Map(), pp: new Map(), bf: new Map(), cpX: [], ppX: [], bfX: [], cpN: maxId(hdr, 'charPr') + 1, ppN: maxId(hdr, 'paraPr') + 1, bfN: maxId(hdr, 'borderFill') + 1 };
  }
  const tplPart = (tag, id) => { const m = DYN.hdr.match(new RegExp(`<hh:${tag} id="${id}"[\\s\\S]*?</hh:${tag}>`)); if (m) return m[0]; return DYN.hdr.match(new RegExp(`<hh:${tag} id="\\d+"[\\s\\S]*?</hh:${tag}>`))[0]; };
  function cpId(sz, b, f = 0, sp = 0, ra = 100) {
    const k = [sz, b ? 1 : 0, f, sp, ra].join('|'); if (DYN.cp.has(k)) return DYN.cp.get(k);
    const id = DYN.cpN++;
    let x = tplPart('charPr', DYN.base.cp).replace(/^<hh:charPr id="\d+"/, `<hh:charPr id="${id}"`).replace(/height="\d+"/, `height="${Math.round(sz * 100)}"`).replace(/<hh:bold\/>/g, '').replace(/<hh:italic\/>/g, '');
    if (!DYN.base.keepFont) x = x.replace(/<hh:fontRef [^>]*\/>/, `<hh:fontRef hangul="${f}" latin="${f}" hanja="${f}" japanese="${f}" other="${f}" symbol="${f}" user="${f}"/>`);
    x = x.replace(/<hh:ratio [^>]*\/>/, `<hh:ratio hangul="${ra}" latin="${ra}" hanja="${ra}" japanese="${ra}" other="${ra}" symbol="${ra}" user="${ra}"/>`);
    x = x.replace(/<hh:spacing [^>]*\/>/, `<hh:spacing hangul="${sp}" latin="${sp}" hanja="${sp}" japanese="${sp}" other="${sp}" symbol="${sp}" user="${sp}"/>`);
    if (b) x = x.replace('<hh:underline', '<hh:bold/><hh:underline');
    DYN.cpX.push(x); DYN.cp.set(k, id); return id;
  }
  const ALN = { c: 'CENTER', l: 'LEFT', r: 'RIGHT', j: 'JUSTIFY', d: 'CENTER' }; // 배분 정렬은 한글에서 치우쳐 보여 가운데 정렬로 통일
  function ppId(al = 'j', ls = 160, l = 0, r = 0, ind = 0, prev = 0, next = 0, sq = false) {
    if (al === 'j') al = 'l'; // HWPX 산출물: 양쪽 정렬 → 왼쪽 정렬
    [l, r, ind, prev, next] = [l, r, ind, prev, next].map(v => Math.round(v * 10) / 10);
    const k = [al, ls, l, r, ind, prev, next, sq ? 1 : 0].join('|'); if (DYN.pp.has(k)) return DYN.pp.get(k);
    const id = DYN.ppN++;
    let x = tplPart('paraPr', DYN.base.pp).replace(/^<hh:paraPr id="\d+"/, `<hh:paraPr id="${id}"`).replace(/horizontal="[A-Z_]+"/, `horizontal="${ALN[al] || 'JUSTIFY'}"`)
      .replace(/(<hh:lineSpacing type=")[A-Z_]+(" value=")-?\d+/g, `$1PERCENT$2${Math.round(ls)}`)
      .replace(/lineWrap="[A-Z_]+"/g, `lineWrap="${sq ? 'SQUEEZE' : 'BREAK'}"`); // SQUEEZE = 한글 '한 줄로 입력'
    const set = (str, dv) => str.replace(/<hc:intent value="-?\d+"/g, `<hc:intent value="${Math.round(ind * 100 / dv)}"`).replace(/<hc:left value="-?\d+"/g, `<hc:left value="${Math.round(l * 100 / dv)}"`)
      .replace(/<hc:right value="-?\d+"/g, `<hc:right value="${Math.round(r * 100 / dv)}"`).replace(/<hc:prev value="-?\d+"/g, `<hc:prev value="${Math.round(prev * 100 / dv)}"`).replace(/<hc:next value="-?\d+"/g, `<hc:next value="${Math.round(next * 100 / dv)}"`);
    if (x.includes('<hp:default>')) { const parts = x.split('<hp:default>'); parts[0] = set(parts[0], 2); parts[1] = set(parts[1], 1); x = parts.join('<hp:default>'); } else x = set(x, 1);
    DYN.ppX.push(x); DYN.pp.set(k, id); return id;
  }
  const MMW = [0.1, 0.12, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 1.0, 1.5, 2.0];
  const mmW = pt => { const mm = pt * 0.3528; let best = MMW[0]; MMW.forEach(v => { if (Math.abs(v - mm) < Math.abs(best - mm)) best = v; }); return (best % 1 ? String(best) : best.toFixed(1)) + ' mm'; };
  /* fill: 색 글자('#RRGGBB') 또는 {img:'image1'}(칸 배경 그림, 크기에 맞추어 — opt.bins로 함께 넣어야 함) */
  function bfId(sd, fill, diag, split) {

function signSheetBlocks(o){

  const info = (o.info || []).filter(Boolean);
  info.forEach(t => B.push(P(t, {sz:11.5, ls:190})));

/* 등록부(서명부) HTML 인쇄물: signSheetBlocks와 같은 o. 명단이 길면 다음 쪽으로 나눠 표 머리를 다시 찍는다(인쇄물 안 스크립트).

${info.length ? `<div class="info">${info.map(t => `<p>${esc(t)}</p>`).join("")}</div>` : ""}
<table class="st">${cg}${head}<tbody>${o.rows.map(r => `<tr>${r.map((c, i) => `<td${i === 0 ? ' class="no"' : ""}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>
<div class="end">${foot.map(t => `<p>${esc(t)}</p>`).join("")}${o.sign ? `<p class="sg">${esc(o.sign)}</p>` : ""}</div>
</div></div>`;

.pin{font-family:"함초롬돋움","HCR Dotum","맑은 고딕","Malgun Gothic","Noto Sans CJK KR",sans-serif}

.sub{font-size:12pt;text-align:center;margin:0}

.end{font-size:12pt;line-height:2;margin-top:5mm}.end p{margin:0}.end .sg{text-align:right;margin-top:6mm}
.pn{position:absolute;left:0;right:0;bottom:8mm;text-align:center;font-size:10pt}`;
  const js = `<script>(function(){
var pages=[document.querySelector(".page")];

    bind: el => { bindInputs(el, ST.index, ["copies","w","h"], ["copies","w","h"]); el.querySelectorAll("[data-wh]").forEach(b => b.onclick = () => { const [w, h] = b.dataset.wh.split(",").map(Number); ST.index.w = w; ST.index.h = h; render(); redraw(); }); } },
  done:{label:"다 됐어요", html: () => { const R = roster().rows;
    const g = {plate:[`명패 ${R.length}장`, "A4 가로 한 장에 한 사람 · 반 접어 세워요", 1, "명패"], label:[`라벨 ${R.length}칸`, `${ST.label.cols}칸 × ${ST.label.rows}줄 라벨지${ST.label.used ? ` · ${ST.label.start}번째 칸부터` : ""}`, 1, "라벨"],
      sign:[`등록부 ${R.filter(p => !p.title).length}명 + 빈 줄 ${+ST.sign.blank||0}`, COLS[signCols()].d, 1, ST.sign.title || "등록부"], index:[`견출지 ${ixSets().reduce((a, s) => a + s.length, 0)}칸`, `${ST.index.w}×${ST.index.h}mm · ${ST.index.copies}부`, 1, "견출지"]};
    return `<div class="done-head"><span class="ck">✓</span><h2 class="q" style="margin:0">다 됐어요</h2></div><p class="qs">인쇄 창에서 <b>배율 100%(실제 크기)</b>, 여백 '없음', '배경 그래픽' 켜기를 고르세요.</p>
    ${made().map(k => `<div class="group"><h3 style="display:block">${TOOLS[k]} <span class="pill info" style="vertical-align:2px;margin-left:6px">${g[k][0]}</span></h3><p class="hint" style="margin:-4px 0 8px">${esc(g[k][1])}</p><div class="outs">
      <button type="button" class="btn" data-out="print" data-t="${k}"><span>🖨️ 인쇄하기</span><small>바로 프린터로</small></button>
      <button type="button" class="btn" data-out="hwpx" data-t="${k}" ${g[k][2] ? "" : "disabled"}><span>📝 한글 파일 받기 (.hwpx)</span><small>${k === "plate" || k === "index" ? "거꾸로 면은 그림 (고치려면 여기서 다시)" : ""}</small></button>
      <button type="button" class="btn" data-out="html" data-t="${k}"><span>🌐 HTML로 받기</span><small>다른 PC에서 열어 인쇄</small></button></div></div>`).join("")}
    <div class="fixes">${plan().filter(s => s !== "what" && s !== "done").map(s => `<button type="button" class="chip" data-go="${s}">${STEPS[s].label} 고치기</button>`).join("")}</div>`; },
    bind: el => { el.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
      el.querySelectorAll("[data-out]").forEach(b => b.onclick = async () => { if(b.classList.contains("busy")) return; const k = b.dataset.t, o = b.dataset.out, lab = b.innerHTML;
        if(o === "hwpx"){ b.classList.add("busy"); b.innerHTML = `<span>⏳ 한글 파일 만드는 중…</span><small>그림이 있으면 몇 초 걸려요</small>`; await new Promise(r => setTimeout(r, 30)); }
        const done = ok => { b.classList.remove("busy"); b.innerHTML = lab; if(ok && o !== "print") toast("받았어요. 내려받기 폴더를 보세요"); }; name = {plate:"명패", label:"라벨", sign:(ST.sign.title || "등록부").replace(/[\\/:*?"<>|]/g, ""), index:"견출지"}[k];
        try{
          if(o === "print"){ const w = window.open("", "_blank"); if(!w){ toast("팝업이 막혔어요. HTML로 받아 열어 인쇄하세요"); return; } const html = k === "label" ? labelSheetHtml(labelItems(), {...labelOpt(), pick:false, picked:[]}) : HTML[k](); w.document.write(html); w.document.close(); setTimeout(() => w.print(), 500); }
          if(o === "html") save(new Blob([k === "label" ? labelSheetHtml(labelItems(), {...labelOpt(), pick:false, picked:[]}) : HTML[k]()], {type:"text/html"}), `${name}.html`);
          if(o === "hwpx"){ if(k === "sign") save(await signHwpx(), `${name}.hwpx`); if(k === "label") save(await UPS.labelHwpx(labelItems(), {...labelOpt(), pick:false}), "라벨.hwpx");
            if(k === "plate"){ const P = ST.plate; save(await UPS.plateHwpx(plateList(), {w:P.w, h:P.h, style:P.style, flip:P.flip, font:P.font, bgSrc:P.bg && P.bg.src}), "명패.hwpx"); }
            if(k === "index") save(await UPS.indexHwpx(ixSets(), {w:ST.index.w, h:ST.index.h}), "견출지.hwpx"); }
          done(true);
        }catch(e){ console.error(e); done(false); alert("만들지 못했어요: " + (e.message || e)); } }); } },
};
function plan(){ const p = ["what"]; if(needNames()) p.push("who");
  if(ST.make.plate) p.push("p_look","p_top"); if(ST.make.label) p.push("l_paper","l_deco"); if(ST.make.sign) p.push("s_meet","s_when","s_cols"); if(ST.make.index) p.push("i_text","i_size");
  p.push("done"); return p; }
function go(s){ STEP = s; if(STEPS[s].tool && ST.make[STEPS[s].tool]) ST.view = STEPS[s].tool; if(s === "who" && ST.view === "index") ST.view = ["plate","label","sign"].find(k => ST.make[k]) || ST.view; if(!(s === "l_paper" && ST.label.used) && !(s === "l_deco" && PICK && (PICK.kind === "bg" || PICK.kind === "frame"))) PICK = null; render(); redraw(); $("pane").scrollTop = 0; }
function autoNext(){ /* 고르면 미리보기만 바뀜. 다음 단계는 아래 [맞아요, 다음] 버튼으로만 (2026-11-12 사용자 결정) */ }
function render(stepsOnly){
  const P = plan(); if(!P.includes(STEP)) STEP = "what";
  const S = STEPS[STEP], i = P.indexOf(STEP);
  if(!stepsOnly){ $("pane").innerHTML = S.html(); S.bind && S.bind($("pane")); }
  // 단계 칩: 도구별로 묶어 한 칩 (명패 1/2처럼 안에서 몇 번째인지)
  const G = []; P.forEach(k => { const t = STEPS[k].tool; const last = G[G.length-1]; if(t && last && last.tool === t) last.steps.push(k); else G.push({tool:t, steps:[k]}); });
  const gi = G.findIndex(g => g.steps.includes(STEP));
  $("steps").innerHTML = `<button type="button" data-home="1" title="처음 화면(무엇을 만들까요?)으로">⌂ 처음으로</button>` + G.map((g, j) => { const cur = j === gi, lab = g.tool ? TOOLS[g.tool] : STEPS[g.steps[0]].label;
    return `<button type="button" data-s="${g.steps[0]}" ${cur ? 'aria-current="step"' : ""} class="${j < gi ? "done" : ""}">${j+1} ${lab}${cur && g.steps.length > 1 ? ` ${g.steps.indexOf(STEP)+1}/${g.steps.length}` : ""}</button>`; }).join("");
  $("steps").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.home ? "what" : b.dataset.s));
  $("progFill").style.width = `${i/(P.length-1)*100}%`;
  const last = i === P.length - 1;
  $("cta").innerHTML = `${i > 0 ? `<button type="button" class="btn back" id="bk">← 뒤로</button>` : ""}${last ? `<button type="button" class="btn" id="home">처음으로</button>` : `<button type="button" class="btn primary" id="nx" data-primary>${STEP === "what" ? "다음" : "맞아요, 다음"}</button>`}`;
  if($("bk")) $("bk").onclick = () => go(P[i-1]);
  if($("home")) $("home").onclick = () => go("what");
  if($("nx")){ $("nx").disabled = S.ok ? !S.ok() : false; $("nx").onclick = () => go(P[i+1]); }
  tabs();
}
document.addEventListener("keydown", e => { if(e.key !== "Enter" || e.isComposing) return; const t = e.target; if(["TEXTAREA","BUTTON","SELECT"].includes(t.tagName)) return; const b = document.querySelector("[data-primary]"); if(b && !b.disabled){ e.preventDefault(); b.click(); } });
/* 일시: 202611261500 → 2026. 11. 26.(목) 15:00 */
function fmtWhen(v){ const d = v.replace(/\D/g, ""); if(!/^\d{8}(\d{4})?$/.test(d) || /[가-힣.]/.test(v)) return v;
  const dt = new Date(+d.slice(0,4), +d.slice(4,6)-1, +d.slice(6,8)); if(isNaN(dt)) return v;
  return `${dt.getFullYear()}. ${dt.getMonth()+1}. ${dt.getDate()}.(${"일월화수목금토"[dt.getDay()]})${d.length === 12 ? ` ${d.slice(8,10)}:${d.slice(10,12)}` : ""}`; }

/* ---------- '이렇게 읽었어요' ---------- */
function readBack(){
  const R = roster(), host = $("read"); if(!host) return;
  if($("nx")) $("nx").disabled = !R.rows.length;
  if(!R.rows.length){ host.innerHTML = ""; return; }
  const showOrg = R.rows.some(p => p.org), sus = R.rows.map(rosterSuspect);
  const map = R.mode === "cells" && R.ncol > 1 ? `<div class="colmap">${R.header ? `<span class="pill ok">머리글을 보고 읽었어요</span>` : `<span>칸 ${R.ncol}개를 이렇게 봤어요:</span>`}
    ${R.roles.map((r, i) => `<label>칸${i+1} <select data-c="${i}">${Object.entries(ROSTER_ROLE).map(([k, l]) => `<option value="${k}" ${k === r ? "selected" : ""}>${l}</option>`).join("")}</select></label>`).join("")}</div>` : "";
  const sm = t => t ? ` <small style="color:var(--muted);font-weight:400">(${esc(t)})</small>` : "";
  host.innerHTML = `<h3>이렇게 읽었어요 <span class="pill info">${R.rows.length}명</span>${sus.some(Boolean) ? `<span class="pill warn">${sus.indexOf(true)+1}번 줄 확인</span>` : ""}</h3>${map}
    <table><thead><tr><th></th>${showOrg ? "<th>소속</th>" : ""}<th>직위</th><th>이름</th></tr></thead><tbody>
    ${R.rows.map((p, i) => p.title ? `<tr><td class="n">${i+1}</td><td colspan="${2 + showOrg}"><span class="tt">${esc([...p.title].join(" "))}</span> <span class="pill info">큰 글자 한 줄</span></td></tr>`
      : `<tr><td class="n">${i+1}</td>${showOrg ? `<td>${esc(p.org)}</td>` : ""}<td>${esc(p.pos) || '<span style="color:#b5bcc0">—</span>'}${sm(p.posSub)}</td><td class="nm">${esc(p.name)}${sm(p.note)}</td></tr>
        ${sus[i] ? `<tr><td></td><td colspan="${2 + showOrg}"><span class="pill warn">'${esc(p.name)}'이(가) 이름이 맞나요?</span> <span class="hint">이름 뒤 글이면 괄호로 묶어 주세요: ${esc(p.pos)} <b>(${esc(p.name)})</b></span></td></tr>` : ""}`).join("")}</tbody></table>
    <p class="hint">작은 글씨 = 괄호 안 글. 틀린 줄은 위 칸에서 고치면 바로 바뀌어요.</p>`;
  host.querySelectorAll("[data-c]").forEach(s => s.onchange = () => { const r = roster().roles.slice(); r[+s.dataset.c] = s.value; ST.roles = r; readBack(); redraw(); });
}
async function loadFile(files){
  try{ const t = await rosterFromFile(files[0]); ST.names = t; ST.roles = null; $("names").value = t; readBack(); redraw(); toast(`'${files[0].name}'에서 명단을 읽었어요`); }
  catch(e){ console.error(e); toast("파일을 읽지 못했어요: " + (e.message || e)); }
}
/* ---------- 명패 모양 카드 그림 ---------- */
function thumbs(el){
  const first = plateList().find(p => p.name) || {org:"", pos:"직위", name:"홍길동"}, P = ST.plate;
  el.querySelectorAll("[data-th]").forEach(box => {
    const k = box.dataset.th, f = document.createElement("iframe"), pxW = P.w*3.7795, pxH = P.h*3.7795;
    const sc = Math.min(box.clientWidth / pxW, 66 / pxH);
    f.style.width = pxW + "px"; f.style.height = pxH + "px"; f.style.transform = `scale(${sc})`;
    f.style.left = ((box.clientWidth - pxW*sc)/2) + "px"; f.style.top = ((66 - pxH*sc)/2) + "px";
    f.srcdoc = plateSheetHtml([first], {w:P.w, h:P.h, style:k, flip:false, font:P.font, org:first.org, bgSrc:P.bg && P.bg.src})
      .replace("</head>", `<style>html,body{background:#fff!important;margin:0;padding:0}.sheet{width:auto!important;height:auto!important;margin:0!important;display:block!important}.pair .card:nth-child(2){display:none}</style></head>`);
    box.appendChild(f);
  });
}
$("forget").onclick = e => { e.preventDefault(); if(!confirm("이 도구가 기억한 명단·모양을 지울까요?")) return; localStorage.removeItem(KEY); location.reload(); };
schoolChip("schoolHost", () => { if(!ST.plate.org) ST.plate.org = SCH(); if(!ST.label.top) ST.label.top = SCH(); render(); redraw(); });
render(); redraw();
</script>
